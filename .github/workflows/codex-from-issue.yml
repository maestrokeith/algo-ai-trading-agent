name: Codex From Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number for Codex to fix
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  codex:
    name: Run Codex From Issue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read issue prompt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          {
            echo "Fix GitHub issue #${ISSUE_NUMBER} in this repository."
            echo
            gh issue view "${ISSUE_NUMBER}" --json title,body --template 'Title: {{.title}}{{"\n\n"}}Body:{{"\n"}}{{.body}}{{"\n"}}'
            echo
            echo "Requirements:"
            echo "- Implement the issue completely."
            echo "- Add or update tests where appropriate."
            echo "- Run relevant validation commands."
            echo "- Do not merge the pull request."
          } > /tmp/codex_prompt.txt

      - name: Create branch
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          git checkout -B "codex/issue-${ISSUE_NUMBER}"

      - name: Install Codex
        run: |
          set -euo pipefail
          if ! command -v codex >/dev/null 2>&1; then
            npm install -g @openai/codex
          fi
          codex --version


      - name: Run Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY repository secret is required to run Codex." >&2
            exit 1
          fi

          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/auth.json" <<EOF
          {
            "OPENAI_API_KEY": "${OPENAI_API_KEY}"
          }
          EOF

          scripts/run_codex_in_actions.sh /tmp/codex_prompt.txt /tmp/codex_result.txt

      - name: Commit changes
        id: commit
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Codex completed without file changes."
            exit 0
          fi
          git status --short
          git add -A
          git commit -m "Fix issue #${ISSUE_NUMBER} with Codex"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.commit.outputs.has_changes == 'true'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          git push --force-with-lease origin "codex/issue-${ISSUE_NUMBER}"

      - name: Open PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          title="$(gh issue view "${ISSUE_NUMBER}" --json title --template 'Codex: {{.title}}')"
          body_file="$(mktemp)"
          {
            echo "Fixes #${ISSUE_NUMBER}"
            echo
            echo "Generated by the manual **Codex From Issue** workflow."
            echo
            echo "Codex final message:"
            echo
            if [ -s /tmp/codex_result.txt ]; then
              cat /tmp/codex_result.txt
            else
              echo "No final message captured."
            fi
          } > "$body_file"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "codex/issue-${ISSUE_NUMBER}" \
            --title "$title" \
            --body-file "$body_file"
