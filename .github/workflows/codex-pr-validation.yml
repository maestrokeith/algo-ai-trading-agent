# AutoOps PR Validation workflow. The workflow name remains stable for dependent triggers.
name: Codex PR Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-codex-pr:
    name: Validate Codex PR
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.head_ref, 'codex/') ||
      contains(github.event.pull_request.labels.*.name, 'codex-pr-opened') ||
      startsWith(github.event.pull_request.title, 'Codex auto-fix:')
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository diagnostic
        run: |
          set -euo pipefail
          pwd
          git status --short
          git rev-parse --show-toplevel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run safe validation
        id: validation
        continue-on-error: true
        env:
          CODEX_PR_VALIDATION_LOG: /tmp/codex_pr_validation.log
          CODEX_PR_RUN_FULL_SUITE: "1"
        run: |
          set +e
          bash scripts/validate_codex_pr.sh
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Build validation comment
        env:
          VALIDATION_STATUS: ${{ steps.validation.outputs.status }}
        run: |
          set -euo pipefail
          {
            echo "Codex PR Validation: ${VALIDATION_STATUS}"
            echo
            echo "Validated:"
            echo "- shell syntax"
            echo "- Python compile"
            echo "- focused tests"
            echo "- full tests"
            echo "- paper/dev diagnostics where available"
            echo
            if [ "${VALIDATION_STATUS}" = "FAIL" ]; then
              echo "Next action:"
              echo "Codex or a human should fix validation failure before merge."
              echo
            fi
            echo "Commands executed:"
            echo '```'
            grep -E '^\$ |^\[exit_code=' /tmp/codex_pr_validation.log || true
            echo '```'
            echo
            echo "Summary of results:"
            echo '```'
            tail -n 160 /tmp/codex_pr_validation.log
            echo '```'
            echo
            echo "Safety:"
            echo "- no auto-merge"
            echo "- no deploy"
            echo "- no live restart"
            echo "- no live broker credentials used"
          } > /tmp/codex_pr_validation_comment.md

      - name: Find previous validation comment
        id: previous-comment
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const marker = 'Codex PR Validation:';
            const previous = comments
              .filter((comment) => comment.user.type === 'Bot' && comment.body.includes(marker))
              .pop();
            core.setOutput('comment_id', previous ? String(previous.id) : '');

      - name: Update or create validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/codex_pr_validation_comment.md', 'utf8');
            const commentId = '${{ steps.previous-comment.outputs.comment_id }}';
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: Number(commentId),
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Update validation labels
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_STATUS: ${{ steps.validation.outputs.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION_STATUS" = "PASS" ]; then
            gh pr edit "$PR_NUMBER" --add-label "codex-validation-passed"
            gh pr edit "$PR_NUMBER" --remove-label "codex-validation-failed" || true
            echo "AUTOOPS_VALIDATION_PASSED pr=${PR_NUMBER}"
          else
            gh pr edit "$PR_NUMBER" --add-label "codex-validation-failed"
            echo "AUTOOPS_VALIDATION_FAILED pr=${PR_NUMBER}"
          fi

      - name: Fail workflow on validation failure
        if: steps.validation.outputs.status == 'FAIL'
        run: |
          set -euo pipefail
          echo "Codex PR validation failed. No merge, deploy, or live restart was performed."
          exit 1
