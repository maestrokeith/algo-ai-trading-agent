name: Engine Site CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'src/api/**'
      - 'engine/**'
      - 'tests/test_research_api.py'
      - '.github/workflows/engine-site.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'src/api/**'
      - 'engine/**'
      - 'tests/test_research_api.py'
      - '.github/workflows/engine-site.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine API dependencies
        run: python -m pip install --upgrade pip pandas numpy fastapi pydantic pytest
      - name: Compile engine and research API
        run: python -m compileall engine src/api/routers/research.py
      - name: Run research API tests
        run: pytest -q tests/test_research_api.py tests/test_paper_scalper.py tests/test_risk_engine.py tests/test_signals.py tests/test_portfolio.py
      - name: Verify execution boundary
        run: |
          python - <<'PY'
          from engine.trading_config import PAPER_ONLY, LIVE_EXECUTION
          from engine.paper_scalper import PaperScalperBacktester
          assert PAPER_ONLY is True
          assert LIVE_EXECUTION is False
          assert PaperScalperBacktester().can_execute_live() is False
          print('paper-only boundary verified')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build engine site
        run: npm run build
