# Algorithmic Trading App - Default Configuration
# Override via environment or config file per environment.

# Risk book mode (``portfolio.risk_book_mode``): at load time applies max gross long MV / equity and
# cash reserve presets (also syncs ``adaptive.max_exposure_by_regime`` + ``cash_management.reserve_by_regime``).
# Use ``custom`` to keep explicit YAML only. Gross cap can exceed 100% of equity when
# ``adaptive.max_exposure_frac_ceiling`` / portfolio overrides allow (e.g. strong-bullish book).
#
# | Mode       | Max gross | Cash reserve (vs equity, stock BP planning) |
# | ---------- | --------- | ------------------------------------------- |
# | safe       | 85%       | 15%                                         |
# | balanced   | 95%       | 5%                                          |
# | aggressive | 100%      | ~1% (bearish regime rows may reserve slightly more) |

# ---------------------------------------------------------------------------
# Regime helpers (live loop — see scripts/run_alpaca_loop.py)
# ---------------------------------------------------------------------------
database:
  enabled: true
  type: sqlite
  path: data/algo_live.db
  journal_mode: WAL
  synchronous: NORMAL
  busy_timeout_ms: 5000

trading_control:
  # Explicit operating mode. Allowed: live, paper, shadow, entries-disabled.
  mode: live
  runtime_profile: controlled_live_equity
  adaptive_relaxation:
    production_auto_apply: false
  max_runtime_failures_before_entry_block: 3
  latency_thresholds:
    max_underlying_quote_age_seconds: 60
    max_option_quote_age_seconds: 30
    max_signal_age_seconds: 300
    max_signal_to_order_seconds: 120
    max_news_age_seconds: 3600
  strategy_readiness:
    minimum_reconciled_samples: 30
    minimum_profit_factor: 1.2
    maximum_drawdown: 0
    maximum_spread_cost_pct_of_pnl: 25
  strategy_states:
    trend_long: LIVE
    momentum_breakout: SHADOW
    dynamic_no_catalyst: SHADOW
    news_only: DISABLED
    options_live: DISABLED
    options_paper: DISABLED
  live_pilot:
    enabled: false
    allowed_strategies:
      - trend_long
    preexisting_position_allowlist:
      - AMZN
      - NFLX
    max_trades_per_day: 1
    max_entry_submissions_per_day: 1
    max_entry_fills_per_day: 1
    max_open_positions: 1
    max_notional_per_trade: 100
    max_total_deployed_notional: 100
    max_daily_loss_usd: 25
    allow_short_selling: false
    allow_add_to_existing: false
    allow_replacements: false
    allow_reallocation: false
    allow_overnight: false
    eod_flatten_required: true
  controlled_live_equity:
    enabled: true
    max_managed_positions: 10
    max_single_order_notional_pct: 0.12
    max_single_order_notional: 5000
    max_symbol_exposure_pct: 15
    strategy_allocation_cap_pct: 60
    portfolio_exposure_cap_pct: 85
    stock_capital_pct: 60
    min_cash_reserve_pct: 12
    daily_loss_limit_pct: 3

contract_quality:
  maximum_spread_percentage: 10
  minimum_volume: 100
  minimum_open_interest: 500
  minimum_delta: 0.35
  maximum_strike_distance: 5
  minimum_dte: 7
  maximum_dte: 45
  maximum_quote_age: 30
  maximum_expected_slippage: 0.05

regime:
  # When market_regime condition is neutral (score 2–3), floor trend-long sizing so the book
  # does not go effective-zero from stacked multipliers; keeps small participation with bounded risk.
  neutral_probe:
    enabled: true
    size_multiplier: 0.3
  score_3:
    max_new_positions: 3

# Min cash reserve (%% of equity held back from deployable buying power) by market-regime when ``market_regime`` supplies score/condition in the live loop. Overrides ``portfolio.min_cash_reserve_pct`` for that pass when a leg resolves; ``defensive`` engine label may use the ``bearish`` row.
# Score ≥4 = bullish, 2–3 = neutral, 0–1 = bearish. Integer/fraction/``"8%"`` allowed per value.
cash_management:
  # When ``portfolio.risk_book_mode`` is safe/balanced/aggressive, replaced at load (see src/risk_book_mode.py).
  reserve_by_regime:
    bullish: 5
    neutral: 8
    bearish: 20

# Proactive rebalancing in ``run_alpaca_loop`` (rfc = rebalance_free_capital). When ``trigger`` is
# set, you do not sell *only* because broker cash is below min_cash_target unless ``low_cash``/``min_cash_target``
# appears. Partial rfc (trim weakest) runs only when ``signal_deterioration`` is present *and* live
# health is below entry strength by ``signal_deterioration_min_gap``. ``stop_loss``/``take_profit`` align
# with the exit engine (no extra loop paths). **stronger_incoming** / **rotate** enables full exit of
# weakest when an incoming name is stronger (rfc full-rotate mode).
rebalance:
  #trigger: "signal_deterioration OR stop_loss OR take_profit"
  trigger: "stop_loss OR take_profit"
  signal_deterioration_min_gap: 0.05

# Live loop cadence (run_alpaca_loop): overrides broker.* when set; 10–15 min exits reduces over-reaction vs 5 min.
timing:
  # Exit pass cadence (5–10 min typical for responsive trims/stops). Kept ≤ entry_interval so entries still get CPU.
  exit_interval_min: 15
  entry_interval_min: 10
  # When any user is in reduce_only (gross book over ``risk.over_exposure_levels.high`` / exposure gate), main loop
  # sleep uses this exit interval minutes instead of ``exit_interval_min`` so stocks/options are re-evaluated sooner.
  reduce_only_mode:
    exit_interval_minutes: 8

live_loop:
  loop_sleep_seconds_live: 120
  loop_sleep_seconds_paper: 15
  loop_sleep_seconds_paper_options: 5
  fast_poll_windows: []

# When many valid entry paths still fail on caps (spread, exposure, symbol/sector limits), relax those caps
# after consecutive cap-style rejections (see src/adaptive.py, run_alpaca_loop).
adaptive:
  relax_caps_if_entry_blocked: true
  relax_factor: 1.2
  # Require this many consecutive cap-block outcomes before relax_factor applies (default 2).
  min_consecutive_cap_blocks: 2
  # Extra cap headroom (spread / exposure / sizing) when composite entry strength is high (see src/adaptive.py).
  allow_cap_override_on_strong_signal: true
  override_multiplier: 1.2
  # Minimum strength in [0,1] to qualify (default 0.82 if omitted).
  # min_strength_for_cap_override: 0.82
  # Optional: restrict to these tickers (omit for all); same idea as strong_signal_cap_relief.relief_symbols.
  # cap_override_relief_symbols: [ "NVDA", "SPY" ]
  # Scale per-bucket long MV / equity cap (``risk`` bucket lines) by regime. Score 2–3 = ``neutral``; 4+ bullish; 0–1 ``bearish`` (``defensive`` in engine) unless ``bearish`` key is set in YAML.
  bucket_cap_multiplier:
    neutral: 1.2
    bullish: 1.5
    bearish: 0.8
  # Max gross long book (fraction of equity) by regime; applied in ``run_entry_gates`` (see :func:`src.adaptive.adaptive_effective_max_total_exposure`). Falls back to ``portfolio.exposure_gates.max_total_exposure_frac`` if the leg is missing.
  # When ``portfolio.risk_book_mode`` is set, replaced at load — values below are for ``custom`` / docs.
  # Values may exceed 1.0 up to ``max_exposure_frac_ceiling`` (e.g. 110% when score≥4 bullish leg — see below).
  max_exposure_frac_ceiling: 1.35
  max_exposure_by_regime:
    bullish: 0.98
    neutral: 0.95
    bearish: 0.85
  # When regime score ≥ 4 and the resolved leg is **bullish**, floor gross cap at this fraction (110%%).
  bullish_score_4_plus_max_exposure_frac: 1.20
  # Per exact ``regime_score``: ``max_exposure`` is a **floor** with the leg (higher of the two).
  # If the neutral leg already exceeds this, there is no change. When you lower ``neutral`` (e.g. to
  # ~0.89 in a user override) but want score 3 a bit looser, set ``regime_3`` to 0.92.
  regime_3:
    max_exposure: 0.92
  # When the entry wave has this many high-strength names (``execution.strong_signal_strength_min``), add ``boost_amount`` to the effective gross cap (capped at 1.0). Live loop only (see ``entry_wave_strong_signal_count`` in ``run_alpaca_loop``).
  boost_exposure_if_many_signals: true
  signal_threshold: 5
  boost_amount: 0.02

# Top-K allocation (CRITICAL): rank passing trend-longs, take top K only — not every pass.
# With ``rank_by_signal_strength: true``, Top-K uses ``rank_top_k_by``: ``momentum_rs_volume`` (momentum+RS+volume) or ``strength_eff`` (legacy single score).
# Midpoint of range → K (``"3-5"`` → 4). Unified cap via ``src.allocation_config.effective_ranked_signals_cap``.
# When ``rank_by_signal_strength`` is false, use ``portfolio.signal_ranking.max_signals_per_loop`` instead.
allocation:
  rank_by_signal_strength: true
  rank_top_k_by: momentum_rs_volume
  allow_core_rebuild_buys: true
  # One of: int, ``"2-3"`` / ``"5 – 8"`` range, ``[2, 3]``, or ``allocate_top_n_min`` + ``allocate_top_n_max``.
  # Keep this tight to avoid capital fragmentation across many marginal names.
  allocate_top_n: "2-3"
  core_rebuild:
    enabled: true
    underweight_threshold_pct: 10
    max_rebuild_notional_pct: 2
    max_symbols_per_cycle: 2
    require_non_bearish_regime: true
    require_spread_ok: true
    allow_when_below_mas: true
    min_cash_reserve_pct: 10
    allow_same_day_rebuild_after_sell: false
    churn_guard:
      enabled: true
      max_hold_minutes: 30
      cooldown_minutes: 180
      lookback_days: 3

# Operator alias for per-cycle allocator throughput. Mirrors the active ranked-entry caps used
# by ``alpha.max_new_positions_per_cycle`` and ``risk.max_new_positions_per_cycle``.
allocator:
  allow_no_trade_cycles: true
  selected_must_execute: false
  if_no_actions_cycles: 2
  fallback:
    enforce_diversity: true
    pick_top_n: 2
    size_pct: 0.1
  max_new_positions_per_cycle: 3
  max_new_positions_neutral: 3
  minimum_cash_to_deploy_pct: 0.05
  min_trade_notional: 1200
  pick_top_n_signals: 3
  reentry_cooldown_after_exit_minutes: 60
  sort_by: momentum
  rank_by: [momentum, volume_spike, distance_from_ema]

correlation:
  max_per_group: 2

# Live entry scan: cap distinct symbols + beta load per correlation bucket (see ``src/portfolio_intelligence.py``).
# ``correlation_group_priority`` resolves overlapping lists (e.g. semiconductors before tech for NVDA).
portfolio_intelligence:
  enabled: true
  # 0 = use ``correlation.max_per_group``; set explicitly to override for PI only.
  max_positions_per_correlation_group: 2
  # Sum of (position MV / equity) * symbol_beta for the bucket; 0 = off. Example: 0.45 ≈ 45% "beta book" in that theme.
  max_beta_units_per_group: 0.55
  correlation_group_priority:
    - semiconductors
    - tech
    - indices
    - defensives
    - cyclicals
  correlation_groups:
    semiconductors:
      - NVDA
      - AVGO
      - AMD
      - SMH
      - SOXL
      - SOXS
      - TSM
      - INTC
      - MU
      - QCOM
      - MRVL
      - AMAT
      - LRCX
      - KLAC
      - ON
  symbol_beta:
    _default: 1.0
    NVDA: 1.45
    AMD: 1.65
    AVGO: 1.15
    SMH: 1.35
    SOXL: 2.8

groups:
  indices: [SPY, IWM, DIA]
  sectors: [XLE, XLI, XLY, XLP, XLU]

correlation_groups:
  tech: [AAPL, MSFT, NVDA, GOOGL, AMZN, SMH]
  indices: [SPY, IWM, DIA]
  defensives: [KO, PEP, XLP, WMT]
  cyclicals: [XLI, XLE, XLF, XLY]

signals:
  max_new_positions: 3
  rank_by:
    - momentum_5m
    - volume_spike
    - distance_from_20ema

# Missing tickers in SYMBOL_SECTOR / user maps: bucket for exposure; optional sector-cap skip in position sizing.
sector:
  default_sector: "other"
  # When false, :class:`PositionSizer` does not apply per-sector % cap for symbols not listed in the sector map.
  enforce_caps_on_unknown: false

# Live entry scan (run_alpaca_loop): respect first-prints window; scan cadence from timing.entry_interval_min (else broker).
entries:
  enable_new_entries: true
  allow_add_to_existing_positions: true
  news_override_trend_prefilter_enabled: true
  news_override_min_score: 8
  max_day_loss_pct_for_news_override: -5.0
  news_override_vwap_reclaim_bars: 5
  avoid_new_entries_before: "09:40"
  # Last regular-session hour (16:00 ET close): no new longs at/after this time. Pairs with avoid_last_hour_new_entries.
  avoid_new_entries_after: "15:10"
  # When > 0, skip the entire new-entry pass if buying power is below this $ amount (0 = off).
  # ~$25k, 5-8 names: require meaningful clips (avoids 10-15 micro positions).
  min_trade_size: 1200
  # When true, entry skips print one JSON object per line (symbol, signal, decision, reason, regime, …).
  structured_skip_logs: true
  # Per-symbol live scan cooldowns: use top-level ``cooldowns`` (default_minutes + leader_overrides).
  # Legacy explicit key — wins over ``symbol_cooldown_minutes`` when set (non-empty).
  # per_symbol_buy_cooldown_min: 10
  # Sell: after a recorded equity exit (stop or profit path in engine state), wait before new buys. Bypass uses
  # strategy.strong_trend_reconfirm_bypass_cooldown + strong_trend_reconfirm_ok (same idea as engine exit cooldowns).
  # After a sell exit: wait before new buys on that symbol (maps operator block_reentry_after_exit_minutes).
  per_symbol_sell_cooldown_min: 20
  # Operator aliases for execution-layer structured exit cooldown tiers.
  symbol_cooldown_stock_minutes: 10
  symbol_cooldown_etf_minutes: 10
  # Legacy alias for buy cooldown (used only if per_symbol_buy_cooldown_min is omitted or empty).
  # min_minutes_since_last_entry_for_symbol: 20
  # Pullback re-entry: top-level ``reentry.allow_pullback_reentry`` → ``allow_reentry_on_pullback`` (config_loader).
  reentry_price_buffer_pct: 0.35
  # Add-on buys (portfolio.allow_add): require daily close < last_entry_price × this (e.g. 0.98). Omit or use 0 or ≥1 to disable.
  add_on_max_price_ratio_of_last_entry: 0.98
  # If true, add-ons may skip the pullback rule when the trend MA filter still passes or news+volume buy applies.
  add_on_allow_when_momentum_continues: true
  # When > 0, skip trend-long work for a symbol if its current long equity |market_value| exceeds this USD (0 = off).
  max_position_market_value_usd: 0
  # Cancel Alpaca open orders older than this many minutes before each entry scan (0 = off).
  cancel_orders_older_than_minutes: 10
  # Legacy alias (used only if cancel_orders_older_than_minutes is unset/empty).
  # cancel_stale_open_orders_minutes: 0

# Minutes between entry-scan buys per symbol (tracker); leaders can use shorter windows.
cooldowns:
  default_minutes: 45
  leader_overrides:
    SMH: 5
    NVDA: 10
    GOOGL: 15
    AMZN: 15
    AAPL: 15
    SPY: 20
    IWM: 20
    PLTR: 5
    SOUN: 5
    AI: 5
    QQQ: 15
    MU: 10

# Merged into ``strategy.exits`` (see config_loader). Partial / broker trims only when unrealized
# gain ≥ partial_trim_trigger_pct; full take-profit at take_profit_pct (after smart scale tiers when enabled).
# Stops, time exits, and trailing (price break) are not gated. Risk (kill-switch) and hard stops unchanged.
# Wider targets: fewer full exits on small noise, room for larger wins (tune with ``strategy.exits.stop_loss_pct``).
exit:
  take_profit_pct: 8.0
  partial_trim_trigger_pct: 10.0
  disable_partial_trim_below_gross_pct: 0.85
  # Defer P/L, risk-budget, and cap *trims* while daily MA trend filter still passes (src/live/exits.py).
  require_signal_break_for_trim: true

# Per-symbol churn control (live equity exits + tracker buys). Persisted: data/position_state_<user>.json
# States used in code: HOLD, TRIMMED, COOLDOWN (ENTERED / EXIT_PENDING reserved for future wiring).
# - After an equity BUY (tracker add/merge): HOLD for hold_after_buy_minutes — discretionary sells skipped.
# - After an equity SELL: TRIMMED if still long, else COOLDOWN; discretionary sells blocked until cooldown ends.
# - Stop-like exits (stop_loss, option_stop_loss, trail) are never blocked by this layer.
# Churn (CRITICAL): set hold_after_buy in the 60–120 min band when this layer is enabled.
position_states:
  enabled: false
  hold_after_buy_minutes: 90
  cooldown_after_sell_minutes: 20

# When the exit pass and capital_allocator disagree on the same symbol in one loop iteration,
# lower number wins (see src/decision_priority.py, LiveExitContext.note_decision_intent).
decision_priority:
  stop_loss: 1
  take_profit: 2
  exposure_trim: 3
  rebalance: 4
  new_entry: 5

# Composite symbol scoring (see src/scoring_engine.py).
scoring:
  enabled: true
  # top_n: first N by rank, then require total >= min_score.
  # threshold: all names with total >= min_score (by rank), up to N.
  # ranked_top_n: top N by composite score (min_score ignored) — typical 10–15.
  selection_mode: ranked_top_n
  min_score: 8
  # Prefer ``top_n_candidates`` over legacy ``max_candidates`` (same N for all selection_mode values).
  top_n_candidates: 25
  # max_candidates: 12   # legacy alias; used only if top_n_candidates is omitted
  # When broker cash ≥ portfolio.high_cash_deploy_pct of equity, overlay these scoring knobs.
  when_high_cash:
    min_score: 6
    top_n_candidates: 30
  # ScoringEngine currently uses MA20, MA50, MA200, and 20-day average volume.
  # Defaults preserve the existing 200-bar requirement for every symbol.
  # Set enable_dynamic_override: true to let dynamic momentum candidates use a
  # shorter configured minimum while core trend candidates keep core=200.
  min_history_bars:
    core: 200
    dynamic: 200
    enable_dynamic_override: false
  weights:
    trend: 1.0
    pullback: 1.0
    volume: 1.0
    regime: 1.0

# Live trend-long risk (see src/risk_limits.py). Fractions: 0.10 = 10% of equity; values > 1 = percent points.
# Bucket = signal-ranking tier (SPY/QQQ | NVDA/MSFT | sector ETFs | others) using long stock market value only.
risk:
  kill_switch_reentry_cooldown_minutes: 30
  strong_reentry_threshold: 0.65
  # Upper bound for single-name stock MV / equity; effective cap = min(this, portfolio symbol cap).
  # In regime score 4, ``portfolio.capital_allocator.symbol_caps.regime_4`` can replace this line (e.g. 15%%).
  # Keep aligned with ``portfolio.max_single_position_pct`` and allocator ``symbol_caps.hard`` when not using regime overrides.
  max_symbol_allocation_pct:
    default: 15
    etf: 22
  # Book-level max gross (%% of equity or 0–1 fraction); merged into exposure gates + gross targets (config_loader).
  max_total_exposure_pct: 85
  # Per-SYMBOL_SECTOR sleeve: prefer ``portfolio.max_sector_pct``; optional stricter override here. Stricter of both wins.
  # sector_cap_pct: 0.30
  max_bucket_allocation_pct: 0.30
  # ``tier_3`` = non–mega-cap, non-priority names (see ``risk_buckets`` + signal tier). 0.40–0.50 of equity; default here 0.45.
  tier_3_cap: 0.45
  # ``mega_cap_beta`` bucket only (see ``risk_buckets.mega_cap_beta``); overrides ``max_bucket_allocation_pct`` for that bucket.
  mega_cap_beta_cap: 45
  # Per-symbol add-on buys per ET day (tracked adds). Alias: ``max_adds_per_symbol_per_day`` (canonical wins if both set).
  max_addons_per_day: 3
  min_minutes_between_adds: 10
  max_new_positions_per_cycle: 5
  # Per-symbol daily churn (also in ``portfolio_risk``; ``risk`` values apply when portfolio_risk omits them).
  # Counts **submitted** buy/sell orders per symbol (persisted across loop restarts). Blocks **new entries** only.
  max_trades_per_symbol_per_day: 4
  # Full long exit (flat) counts one round trip; blocks further **entries** on that symbol for the ET day.
  max_round_trips_per_symbol: 2
  # When long gross MV / equity **multiple** ≥ trigger, RFC gross-cap bulk trim sells ``emergency_deleverage_pct``
  # of total eligible long ``market_value`` in one pass (greedy, ``bulk_trim_priority`` order); else legacy
  # equity-tier notional caps (:func:`emergency_bulk_trim_notional_usd`).
  emergency_deleverage_trigger: 1.30
  emergency_deleverage_pct: 0.30
  bulk_trim_priority:
    - highest_weight
    - weakest_pnl
  # In reduce_only mode, when gross long MV / equity **multiple** exceeds threshold (default 1.2), cancel every open order once per heartbeat pass (requires broker.cancel_all_orders).
  emergency_cancel_all_open_orders: true
  # emergency_cancel_all_open_orders_gross: 1.2
  # Live loop exit pass: trim long equity when MV / equity exceeds merged symbol cap + threshold (see src/risk_limits.py).
  enforce_position_caps_on_hold: true
  rebalance_on_breach: true
  rebalance_threshold_pct: 1.0
  # Gross long MV / equity bands (fractions: 0.95 = 95% of equity). `high` is the default reduce-only
  # threshold (overrides `portfolio.exposure_gates.overexposed_reduce_only_gross_frac` when this map is set).
  # See :func:`src.risk_limits.parse_risk_over_exposure_levels` and `gross_exposure_tier`.
  over_exposure_levels:
    mild: 0.95
    high: 1.00
    critical: 1.05
  # Post-scan capital allocator: no **buy** legs when gross (long MV / equity) is strictly above this **fraction** (0.94 = 94%%). Omit to disable.
  no_recycle_above_pct: 0.94

live_risk_protection:
  consecutive_losing_sessions:
    enabled: true
    sessions: 2
    route: trend_long
    require_win_rate: 0
    require_pnl_below: 0
  intraday_loss_guard:
    enabled: true
    stop_new_entries_loss_pct: 0.35
    flatten_loss_pct: 0.50
  sleeve_churn_guard:
    enabled: true
    weak_exit_threshold: 3
  profit_protection:
    enabled: true
    breakeven_trigger_pct: 0.5
    trailing_trigger_pct: 1.0
    trailing_stop_pct: 0.5
    partial_take_profit_pct: 1.5
    partial_take_profit_fraction: 0.5
    time_stop_not_green_minutes: 15

entry_quality:
  enabled: true
  scoring_enabled: true
  threshold:
    default: 80
    strong_regime: 75
    neutral_regime: 80
    weak_regime: 85
  market_vwap_penalty: 8
  strong_news_override: true
  dynamic_cooldown: true
  weights:
    trend: 20
    pullback: 15
    momentum: 20
    volume: 15
    symbol_vwap: 10
    market_vwap: 10
    regime: 5
    spread: 5
  max_zero_noncritical_factors: 1
  unavailable_feature_policy: conservative
  flexible_entry:
    enabled: true
    size_by_score:
      90: 1.00
      85: 0.75
      80: 0.50
      75: 0.25
  dynamic_cooldown_minutes:
    loss_min: 60
    loss_max: 90
    small_winner: 30
    large_winner: 15
    fresh_catalyst_reduction: 15
    fresh_catalyst_window_minutes: 120
  live_min_quality_score: 6
  paper_min_quality_score: 5
  confirmation_quality_score: 8
  weak_regime_live_min_quality_score: 8
  weak_regime_score_lte: 2
  weak_regime_paper_size_fraction: 0.5
  starter_size_fraction: 0.25
  require_market_vwap: true
  require_symbol_vwap: true
  require_sector_confirmation: true
  max_vwap_extension_pct: 1.5
  max_atr_extension: 2.0
  tight_spread_pct: 0.35
  min_relative_volume: 0.75
  strong_catalyst_threshold: 6.0
  dynamic_no_catalyst_min_quality_score: 7
  relative_strength_top_n_live: 2
  relative_strength_top_n_paper: 3

# Bucket keys for long-stock MV / equity (see ``risk.tier_N_cap`` / ``risk.mega_cap_beta_cap`` and ``max_bucket_allocation_pct``).
# Symbols not listed fall back to signal tier keys ``tier_0`` … ``tier_3``. First matching bucket wins.
risk_buckets:
  mega_cap_beta: [SPY, XLK, SMH, NVDA, MSFT, AAPL, META, AMZN, GOOGL]
  financials: [XLF, JPM, BAC, GS, MS, WFC]
  health: [XLV, LLY, JNJ, ABBV, UNH, ISRG]

# ---------------------------------------------------------------------------
# 1) Universe & Data
# ---------------------------------------------------------------------------
# Traded symbols = universe.symbols minus universe.paused_symbols.
# Inverse ETFs (SQQQ/SPXS) are configured under universe.bear_etfs only (not counted in regime % unless listed in symbols).
# Core universe: tighter momentum/leader set for live scans. Defensive staples,
# slow industrial rotation, and low-vol ETFs are intentionally excluded to reduce churn.
universe:
  symbols:
    # Core ETFs / beta
    - SPY
    - QQQ
    - IWM
    - XLK
    - XLF
    - XLE
    - XLY
    - SMH
    # Mega-cap tech / platform leaders
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
    - GOOGL
    - AVGO
    - AMD
    - ORCL
    - NFLX
    # High-liquidity growth / AI / semis
    - PLTR
    - CRWD
    - DDOG
    - NOW
    - SNOW
    - UBER
    - SHOP
    - SQ
    - ARM
    - MU
    - ANET
    - MRVL
    - SMCI
    - TSM
    # Select liquid leaders outside tech
    - JPM
    - GS
    - LLY
  paused_symbols: []   # add tickers here to exclude from scan/trade
  # Regime filter: when < 30% above 50D MA = bearish → skip long entries; bear ETFs if breakdown
  regime_min_pct_above_50d_ma: 0.30
  # Inverse ETFs: max_positions = max distinct bear tickers held; total notional cap (max_exposure_pct_equity).
  bear_etfs:
    symbols:
      - SQQQ
      - SPXS

    breakdown:
      reference_symbol: QQQ
      ma_period: 50
      # True = require a *new* daily cross down (prior close >= MA, latest < MA), not merely extended trade below MA.
      require_fresh_cross_below_ma: true

    prefer_sqqq_when_breakdown_reference_is_qqq: true

    max_positions: 3
    max_exposure_pct_equity: 30
    stop_pct: 2.0

    controlled_scaling:
      enabled: true
      symbol: SQQQ
      reference_symbol: QQQ
      ma_period: 50
      # Spacing between SQQQ controlled-scaling adds (minutes between scale-ups).
      cooldown_minutes: 15

      steps:
        - reference_ma_distance_pct_min: 1.0
          size_multiplier: 0.40
        - reference_ma_distance_pct_min: 2.5
          size_multiplier: 0.30
        - reference_ma_distance_pct_min: 4.0
          size_multiplier: 0.30

      require_price_above_last_entry: true

    # After a full SQQQ exit (tracker cleared), optional gates before the next *stock* entry.
    # Does not block QQQ puts / bearish options (those run before stock). Controlled scaling adds unchanged.
    sqqq_reentry:
      enabled: true
      full_exit_cooldown_minutes: 180   # longer cooldown reduces SQQQ in/out same day under PDT caps
      # After exit, QQQ must trade below the QQQ daily close recorded at exit (stricter than “still below MA”).
      require_qqq_close_below_exit_reference: true
      max_initial_stock_entries_per_et_day: 1        # cap fresh SQQQ stock opens per NY day (scaling adds use other path)

    # Legacy YAML only — run_alpaca_loop does not read this (use controlled_scaling).
    sqqq_add_on_strong_trend:
      enabled: false
      reference_ma_distance_pct_min: 1.5
      size_multiplier: 0.35
  # Bearish regime: by default no new trend longs. Optionally allow some, capped:
  bearish_allow_trend_long_entries: false   # true = still run entry scan when bearish (subject to max below)
  bearish_max_normal_long_positions: null    # e.g. 4 — max non-inverse long positions when bearish (null = no cap)
  # When true: if market regime condition is known — bullish/neutral allow trend longs without inverse
  # hedge; defensive blocks trend longs (use bear/SQQQ path). If condition unknown (scorer off),
  # legacy rule: require long hedge (strategy_v2.hedging.symbol, default SQQQ).
  require_sqqq_for_trend_long_entries: false
  # Minimum liquidity / volume filters
  min_avg_dollar_volume_30d: 50_000_000
  min_atr_multiple_for_volume: 0.5   # min volume vs ATR-based expectation



trading:
  dynamic:
    high_conviction_news_override:
      enabled: true
      min_catalyst_score: 8.0
      min_event_score: 7.0
      min_news_score: 7.0
      min_relative_volume: 1.5
      max_catalyst_age_minutes: 180
      # Controlled entry relaxation only. These thresholds may bypass trend prefilters,
      # but stop losses, position limits, cash reserves, allocator controls, exposure
      # controls, and risk controls still run unchanged after the override.
      thresholds:
        earnings_beat:
          min_catalyst_score: 8.0
          min_event_score: 7.0
          min_news_score: 7.0
        analyst_upgrade:
          min_catalyst_score: 8.0
          min_event_score: 7.0
          min_news_score: 7.0
        acquisition:
          min_catalyst_score: 8.0
          min_event_score: 7.0
          min_news_score: 7.0
        fda_approval:
          min_catalyst_score: 8.0
          min_event_score: 7.0
          min_news_score: 7.0
        major_ai_partnership:
          min_catalyst_score: 8.0
          min_event_score: 7.0
          min_news_score: 7.0
        government_contract:
          min_catalyst_score: 8.0
          min_event_score: 7.0
          min_news_score: 7.0
      replacement_strength_ratio: 1.05
      normal_replacement_strength_ratio: 1.2
      require_positive_sentiment: true

market_data:
  provider: alpaca
  # Dynamic scanner quote retry: bounded retries for transient unstable
  # bid/ask snapshots only. This does not bypass bad quotes, stale quotes,
  # spread caps, or core/trend behavior. Enabled for this week's paper
  # dynamic experiment; live_dynamic_quote_retry remains as a legacy alias.
  dynamic_quote_retry:
    enabled: true
    live_enabled: true
    paper_enabled: true
    attempts: 2
    delay_seconds: 0.25
  live_dynamic_quote_retry:
    enabled: true
    attempts: 2
    delay_seconds: 0.25


# Dynamic intraday universe scan / rotation (optional; wire in live loop when implemented).
dynamic_universe:
  # Aggressive dynamic mode: let news/momentum names use a larger sleeve and enter on
  # earlier intraday strength, while keeping volume quality, churn guards, hard stops,
  # emergency exits, and round-trip protections unchanged.
  # dynamic_live_loosen_v1: increase dynamic candidate conversion without weakening
  # quote/liquidity safety. Hard filters unchanged: min_price, max_spread_pct,
  # execution_max_spread_pct, unstable_quote, and min_avg_volume.
  enabled: true
  max_symbols: 30   # alias: top_n
  exclude_suffixes:
    - W
    - WS
    - WT
    - U
    - R
  refresh_minutes: 10
  entry_check_interval_minutes: 10
  exit_check_interval_minutes: 5
  artifact_history:
    enabled: true
    directory: data/dynamic_scan_history
    retention_days: 30
  corporate_actions:
    # Optional Alpaca corporate-action awareness for dynamic scan runners.
    # Disabled by default; when enabled, reverse splits/mergers are blocked while
    # lower-severity actions are annotated and allowed.
    enabled: false
    lookback_days: 7
    persist: true
    persist_dir: data/research/corporate_actions
  # Paper-only controlled experiment: when enabled, dynamic candidates in paper mode
  # may use its min_bars instead of the configured dynamic history floor below.
  paper_min_history_bars_experiment:
    enabled: true
    min_bars: 50
  # Paper-only controlled experiment: when enabled, dynamic candidates in paper mode
  # use min_realloc_leg instead of minimum_cash_to_deploy for the allocator
  # deployment floor. Live mode and core/trend-long candidates ignore this.
  paper_dynamic_min_deploy_experiment:
    enabled: true
    use_min_realloc_leg: true

  regime_relax:
    enabled: true
    strength_threshold_mult: 0.85

  # dynamic_live_history_180_v1: lower the dynamic-only daily history gate from
  # 200 to 180 based on June 15 live history-gate research (BTQ 180/200 would
  # pass; AHMA 163/200 remains blocked). Quote, liquidity, sizing, allocator,
  # order, and risk gates remain unchanged.
  min_history_bars: 180
  # July 1 Phase 1: live-only daily-history floor for scanner-selected
  # DYNAMIC_ONLY candidates. Core, scoring, trend-long, paper, options, and
  # non-dynamic-only candidates continue to use their existing history gates.
  live_min_history_bars: 50
  # Live-only execution throttle for dynamic weak-catalyst candidates rejected
  # by the final execution guard. Does not apply to paper, core/trend-long,
  # exits, sells, or strong-catalyst dynamic candidates.
  weak_catalyst_execution_cooldown_minutes: 10
  # Default-off live-only experiment for weak_catalyst_dynamic_non_exceptional_live
  # stocks. It never applies to options, paper, core/trend-long, exits, or sells;
  # all normal downstream risk, stop, exposure, spread, ATR, and execution gates remain.
  live_weak_catalyst_exception_experiment:
    enabled: false
    min_price: 8
    min_gain_pct: 10
    min_relative_volume: 0.5
    max_spread_pct: 0.25
    require_entry_eval_pass: true
    max_atr_pct: 15
    max_positions_per_day: 1
    notional_cap: 300
    require_no_existing_position: true
  # Strategy V2 expectancy gate: caps, or explicitly blocks, only
  # dynamic_momentum_override buy exposure from recent read-only signal
  # expectancy reports. It does not affect core/trend-long, options, exits,
  # sells, stop-losses, or any existing risk/quote/spread guards.
  dynamic_momentum_expectancy_gate:
    enabled: true
    live_enabled: false
    min_expectancy_score: 0.0
    lookback_days: 5
    min_samples: 5
    reduce_only_when_negative: true
    fallback_allow_if_no_data: true
    blocked_symbols: []
    reduced_symbols: []
    max_notional_when_negative: 300

  min_price: 2
  max_price: 150
  max_atr_pct: 15.0
  min_day_gain_pct: 2.0   # alias: min_gain_pct; dynamic_live_loosen_v1 from 3.0
  max_day_gain_pct: 80.0  # alias: max_gain_pct

  min_avg_volume: 5000
  # dynamic_stock_rvol_loosen_v2: guarded stock-only loosen for live and paper
  # dynamic mode. Hard filters remain unchanged: spread caps, unstable quote,
  # min/max price, VWAP extension, catalyst fast-lane, sizing, risk, stops,
  # max positions, allocation, and options paper-only behavior.
  min_relative_volume: 0.3
  min_rel_volume: 0.3
  aggressive_mode:
    enabled: false
    minimum_price: 2.0
    maximum_price: 300.0
    minimum_day_gain_pct: 0.5
    catalyst_minimum_day_gain_pct: -2.0
    minimum_relative_volume: 0.75
    catalyst_minimum_relative_volume: 0.40
    max_symbols: 50
    max_spread_by_tier:
      large_cap: 1.5
      normal: 3.0
      low_price: 5.0
      fast_lane: 6.0

  # June 12 after the RVOL loosen, INTC/NOK passed RVOL but were blocked by
  # intraday range slightly below 1.5. This is a cautious loosen to 1.0, not
  # a broad relaxation; entry alignment, breakout/new-high/ORB, history,
  # allocator, sizing, risk, cooldown, exits, stops, and options are unchanged.
  min_intraday_range_pct: 1.0
  min_atr_expansion_ratio: 0.25

  require_5m_trend_alignment: false

  max_spread_pct: 2.5
  execution_max_spread_pct: 8.0
  strong_catalyst_override:
    enabled: true
    min_news_score: 3
    min_event_score: 2.5
    max_day_gain_pct: 250
    max_spread_pct: 5.0
    keep_min_price_filter: true
    keep_bad_quote_filter: true
    keep_unstable_quote_filter: true

  catalyst_boost:
    enabled: true
    min_news_score: 0.60
    score_boost: 2.0
    allow_rel_volume_relax: true
    min_relative_volume_with_catalyst: 1.0
    allow_vwap_relax: true
    max_gain_pct_catalyst: 250
    max_gain_pct_with_catalyst: 250

  # Dynamic/news-driven sleeve caps for aggressive mode. These increase room for
  # high-quality movers without changing churn controls or stop/emergency behavior.
  max_total_exposure_pct: 30
  max_symbol_exposure_pct: 12

  cooldown_profit_minutes: 390
  cooldown_loss_minutes: 780
  reentry_cooldown_minutes: 60
  max_hold_minutes: 300
  force_exit_before_close_minutes: 20
  close_intraday_positions_before_close: true
  minutes_before_close_to_flatten: 10
  allow_overnight_dynamic_hold: false
  max_entry_vwap_extension_pct: 8.0
  weak_catalyst_max_entry_gain_pct_live: 15.0
  weak_catalyst_exceptional_rvol: 3.0
  weak_catalyst_late_entry_reduction: 0.5
  early_watch_gain_min_pct: 8.0
  early_watch_gain_max_pct: 12.0
  early_watch_recheck_seconds: 30
  early_watch_enabled_live: true
  min_profit_before_full_exit_pct: 2.0
  atr_exit:
    enabled: true
    stop_atr_mult: 1.5
    target_atr_mult: 3.0
    trail_after_atr_mult: 2.0
    trail_atr_mult: 1.0

dynamic_aggressive:
  enabled_live: true
  max_positions: 1
  max_notional: 500
  min_gain_pct: 8.0
  max_gain_pct: 25.0
  min_relative_volume: 1.5
  require_vwap_above: true
