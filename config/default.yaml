    max_daily_realized_loss_pct: 1.0
    minimum_price: 2.0
    normal_threshold: 60
    fast_lane_threshold: 50
    strong_regime_threshold: 55
    neutral_regime_threshold: 60
    weak_regime_threshold: 65
    severe_risk_off_threshold: 75
