  require_ema_5_above_20: false

market:
  open_protection:
    enabled: true
    dynamic_scan_delay_minutes: 5

# Tiered / trailing exits for dynamic-universe positions (optional).
dynamic_exits:
  enabled: true
  take_profit_1_pct: 3.0
  take_profit_1_sell_frac: 0.25
  take_profit_2_pct: 7.0
  take_profit_2_sell_frac: 0.75
  trailing_stop_pct: 2.0
  vwap_break_exit: false
  # Strong-news dynamic positions keep a 3-hour eligibility window in the live scanner.
  strong_news_hold_minutes: 30
  strong_news_trailing_trigger_pct: 8.0
  strong_news_trailing_stop_pct: 4.0

# NewsAPI → FinBERT (optional). Default off; live loop forces OFF when using --live (see run_alpaca_loop).
news_sentiment:
  enabled: true
  newsapi_key_env: NEWSAPI_KEY
  headline_lookback_hours: 24
  max_headlines: 15
  cache_ttl_seconds: 900
  finbert_model: ProsusAI/finbert
  positive_score_threshold: 0.12   # FinBERT score ~[-1,1]: buy if >= this AND volume spike
  negative_score_threshold: -0.12  # sell if <= this AND weak trend (close < MA)
  volume_spike_min: 1.5            # last-day volume / avg prior N days
  volume_lookback_days: 20
  weak_trend_ma_period: 20
  alpaca_realtime:
    # Optional near-real-time Alpaca news ingestion for dynamic catalyst discovery.
    # Disabled by default; NewsAPI/SEC/premarket artifacts remain the primary path.
    enabled: false
    lookback_minutes: 30
    max_age_seconds: 900
