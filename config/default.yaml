    # When ``regime_condition`` from MarketRegimeScorer is set (bullish / neutral / defensive), caps ATR%% for DNT.
    # Keys must match scorer labels: defensive (= bearish bucket), not "bearish".
    max_atr_pct_regime:
      defensive: 3.0
      neutral: 9.0
      bullish: 6.0
    max_atr_pct: 9.0       # fallback when regime_condition absent
    max_atr_pct_bullish_regime: 6.0   # when score ≥ bullish_regime_min_score and no regime map hit
