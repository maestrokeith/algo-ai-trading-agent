  extra_mover_symbols: []

  # Tape context: add weighted %% move from sector/theme ETFs into ranking score (SMH/XLK/XBI hot = boost).
  theme_momentum_bonus_etfs:
    SMH: 0.35
    XLK: 0.25
    XBI: 0.15
    XLE: 0.15

  # Optional: require candidate day %% gain ≥ benchmark (SPY) + spread (sector strength vs broad market).
  sector_strength:
    enabled: false
    benchmark: SPY
    min_outperformance_vs_benchmark_pct: 0.0

  # Momentum continuation on 5-minute closes (last N bars strictly stepping up).
  min_5m_consecutive_up_bars: 0

# Stricter scanner tape for continuation names + optional bypass of MA/pullback and 5m>20m EMA guard on entry.
dynamic_momentum_override:
  enabled: true
  min_day_gain_pct: 20
  min_relative_volume: 1.8
  require_above_vwap: false
  allow_without_pullback: true
  allow_without_ema_pullback: true

trend_long:
  reentry_protection:
    enabled: true
    live_enabled: false
    cooldown_minutes_after_stop: 90
    require_new_breakout: true
    require_new_intraday_high: false
    require_new_signal_timestamp: true

# Live entry for scanner-added names: tape + spread + VWAP + intraday confirmation (5m breakout / session high / strong green bar).
dynamic_momentum_entry:
  enabled: true
  allocator_allow_no_catalyst_if_scanner_selected: true
  min_day_gain_pct: 2.0         # dynamic_live_loosen_v1 from 3.0
  min_relative_volume: 0.3      # dynamic_stock_rvol_loosen_v2 opportunity gate only
  catalyst_min_relative_volume: 0.35
  max_entry_spread_pct: 3.0     # require spread_pct < this
  require_above_vwap: true
  # dynamic_live_alignment_v1: allow high-quality dynamic_momentum_override names
  # above VWAP to pass alignment without breakout/new-high/strong-green/ORB.
  # Hard filters stay intact: RVOL floor, spread cap, VWAP, ATR/range checks,
  # risk caps, stops, sizing, and allocator protections.
  vwap_score_alignment:
    enabled: true
    min_score: 80
    min_day_gain_pct: 15
  # Session-aware dynamic RVOL confirmation. Keeps volume protection but allows
  # high-quality dynamic names a small post-11am ET miss tolerance.
  adaptive_volume_confirmation:
    enabled: true
    after_11am_enabled: true
    after_11am_min_relative_volume: 0.25
    minor_miss_tolerance: 0.15
    strong_score_min: 80
    strong_gain_pct_min: 8.0
    require_momentum_confirmation: true
  strong_green_body_frac: 0.55
  # Opening range (first N minutes of RTH): entry allowed when price breaks above OR high (1m bars with timestamps).
  opening_range_breakout:
    enabled: true
    minutes: 15
  # Volatility DNT + MQ spike gate ATR%% cap for entry_route=momentum_breakout (scanner adds).
  dynamic_atr_cap: 15
  # Intraday momentum composite for scanner names; only ``momentum_top_n`` highest may enter per scan pass.
  momentum_top_n: 3
  momentum_score:
    enabled: true
    weights:
      rel_volume: 0.3
      gain_pct: 0.3
      five_min_breakout: 0.2
      vwap_distance: 0.2
    normalize:
      rel_volume_max: 5.0
      gain_pct_max: 50.0
      vwap_distance_pct_max: 15.0
  # When true, also apply legacy dynamic_entry_guard (RSI / VWAP distance / 1m EMA stack).
  apply_legacy_dynamic_guard: false
  # Small starter buys for scanner-added names with strong news (bypass breakout confirmation only).
  news_dynamic_entry:
    min_news_score: 2
    min_relative_volume: 1.0
    max_spread_pct: 1.0
    starter_notional_usd: 750
    starter_notional_fraction_of_normal: 0.25
    early_min_news_score: 3
    early_min_relative_volume: 0.5
    early_max_spread_pct: 1.5

dynamic_entry:
