  adaptive_sensitivity:
    enabled: true
    default_mode: normal
    lookback_trading_days: 10
    minimum_observations: 5
    target_entries_per_day:
      minimum: 2
      preferred: 4
      maximum: 6
    quality_score:
      normal_min_quality_score: 80
      relaxed_reduction: 5
      absolute_floor: 70
    rvol:
      normal_min: 1.5
      relaxed_large_cap_min: 1.25
      relaxed_other_min: 1.50
    no_chase:
      normal_max_vwap_distance_atr: 1.0
      relaxed_max_vwap_distance_atr: 1.25
      absolute_max_vwap_distance_atr: 1.50
    one_minor_rule_exception:
      enabled: true
      max_failed_minor_rules: 1
    sizing:
      normal_multiplier: 1.0
      relaxed_multiplier: 0.50
      exception_multiplier: 0.35
    safety:
      max_rolling_drawdown_pct: 2.0
      max_relaxed_loss_rate: 0.60
      disable_in_risk_off_regime: true
  # Optional cached news scoring for live exit decisions; no live API required unless enabled elsewhere.
news_ai:
