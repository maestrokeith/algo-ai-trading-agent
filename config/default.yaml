    setup_types:
      fresh_breakout: true
      vwap_reclaim: true
      ema_pullback: true
      higher_low_continuation: false
      consolidation_break: false
    one_minor_rule_exception:
      enabled: true
      max_minor_failures: 1
    sizing:
      vwap_reclaim_multiplier: 0.50
      ema_pullback_multiplier: 0.50
      higher_low_multiplier: 0.50
      consolidation_break_multiplier: 0.60
      minor_exception_multiplier: 0.35
    data_quality:
      require_vwap: true
      require_atr: true
      require_short_ema: true
