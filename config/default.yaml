      symbols: [NVDA, AMD, AVGO, MU, ARM, MRVL, QCOM, TSM, INTC, SMCI]
    cybersecurity:
      etfs: [CIBR, HACK]
      symbols: [CRWD, PANW, ZS, FTNT, OKTA, S, NET]
    energy:
      etfs: [XLE, OIH]
