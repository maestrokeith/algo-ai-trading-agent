# ---------------------------------------------------------------------------
# Alpha — ranked signal selection (composite scoring weights + per-cycle new-name cap)
# Merges with ``portfolio.signal_ranking``; see src/alpha_config.py.
# ---------------------------------------------------------------------------
alpha:
  rank_candidates: true
  max_new_positions_per_cycle: 3
  selection_method: top_n
  # Optional: cap ranked trend-long dispatch per cycle after full sort (``only_best: true`` = top 1).
  # omit = use portfolio ``max_take`` / effective cap only (see src.alpha_config.alpha_cap_ranked_take).
  # select_top_k: 1
  scoring:
    weight_trend: 0.3
    weight_momentum: 0.3
    weight_pullback: 0.2
    weight_volatility: 0.2

# Min range / ATR for specific defensive, slow-tape names (separate from trade_filters)
filters:
  # Latest bar in ``ohlcv`` (live: usually daily from Alpaca): (high−low)/close*100; not 1m intraday.
  min_intraday_range_pct: 1.0
  min_atr_pct: 1.2
  symbols: [KO, XLP]
  # Regime: skip chop / neutral (AND across all enabled; turn off the EMA pair to use only ADX).
  require_adx: false
  adx_min: 20.0
  adx_period: 14
  require_price_above_20ema: true
  require_20ema_slope_positive: true
  # Disabled by default. Dynamic momentum callers may pass strong context to
  # tolerate a near-flat 20 EMA slope without disabling the trend filter.
  ema_slope_tolerance:
    enabled: false
    max_negative_slope_pct: 0.02
    strong_momentum_score_min: 80
    allow_breakout_continuation: true

# Post stop-loss: same-symbol re-entry wait + optional MA/regime bypass (merged into strategy.exits by config_loader).
cooldown:
  after_stop_loss_minutes: 30
  allow_reentry_if_strong_trend: false

# After stop / profit exit: optional “new high above stop” gate + pullback vs strict exit price (config_loader).
reentry:
  require_new_high: false
  allow_pullback_reentry: true

# Merged into ``strategy.exits`` (see config_loader). Kill-switch aliases: ``partial_sell_pct`` → ``sell_fraction``;
# ``drawdown_threshold_pct`` → ``max_atr_pct`` when the latter is omitted.
exits:
  kill_switch:
    mode: partial
    drawdown_threshold_pct: 3.0
    partial_sell_pct: 0.20

# ---------------------------------------------------------------------------
# 2) Strategy (trend-following; see README for behavior — must match code in src/strategy.py)
# ---------------------------------------------------------------------------
strategy:
  type: trend_following   # trend_following | mean_reversion | breakout
  reinforcement:
    enabled: true
    add_if_profit_pct: 0.5
    max_adds: 2
  # player_focus retail: MAs from strategy.retail + shorter time exit. institutional: adds volume filter on entry.
  player_focus: retail   # retail | neutral | institutional
  # Institutional: only trade when volume >= N x 20d avg (proxy for institutional activity)
  institutional:
    min_volume_ratio_vs_avg: 1.2   # e.g. 1.2 = 20% above average volume
  # Retail: overrides MA periods; time_bars_exit here overrides strategy.exits.time_bars_exit in code (see strategy.py).
  retail:
    ma_fast: 10
    ma_slow: 50
    time_bars_exit: 20   # live loop: compared to calendar days since entry (positions_tracked), not bar count
  # Candlestick filter: only enter when one of these patterns appears (uses same OHLC)
  candlestick_filter:
    enabled: false
    patterns: [ "bullish_engulfing", "hammer" ]   # or "doji"; leave empty to allow any
  # Live loop trend prefilter (run_alpaca_loop) before entry gates — relax to trade more names above short MA only.
  trend_filter:
    require_above_both_ma: false
    allow_above_fast_ma: true
    # Slack vs fast/slow MA (percent points): 0.1 → price may sit up to 0.1%% below the MA and still pass.
    ema_tolerance_pct: 0.1
  # When the live-loop trend MA prefilter fails, optional non-trend entries (run_alpaca_loop).
  # Each style uses ``entry_override`` so full gates still run; set enabled true to activate.
  alternate_entries:
    enabled: false
    min_regime_score: 2
    signal_strength: 0.82
    order: [breakout, mean_reversion, volatility]
    allow_for_add_on: false
    breakout:
      enabled: true
      lookback: 20
      breakout_epsilon_pct: 0.05
    mean_reversion:
      enabled: true
      rsi_period: 14
      rsi_max: 38
      ma_long: 200
    volatility:
      enabled: true
      atr_pct_min: 1.25
      atr_pct_max: 8.0
      daily_range_close_frac: 0.55
  trend_following:
    # Retail / more entries: 10/50 MAs, momentum; ATR caps align with volatility_do_not_trade regime tiers.
    entry_mode: momentum
    ma_fast: 10
    ma_slow: 50
    pullback_touch_ma_fast: true
    pullback_tolerance_pct: 2.0   # used only when entry_mode: pullback
    volatility_filter_atr_period: 14
    # Entry filter: block when ATR%% on the bar exceeds this (see TrendFollowingStrategy.generate_entry).
    max_atr_pct_for_entry: 6.0
    max_atr_pct_for_entry_bullish: 6.0
    bullish_regime_min_score_for_atr: 4
    # Normalized composite score (0–1) on entries → :class:`EntrySignal` ``strength``; sizer uses it
    # with ``position_sizing.volatility_sizing.signal_strength_mapping: proportional`` (see position_sizing.py).
    entry_signal_strength:
      enabled: true
  exits:
    # Trailing: ``use_trailing_stop`` + ``trailing_stop_pct`` (post–partial-profit); ``smart_trailing`` (profit
    # arm + dynamic trail %% / ATR + scale-outs). Evaluated each exit pass at ``timing.exit_interval_min``.
    stop_loss_pct: 1.5
    # Wall-clock minimum before partial, trail, time exit, kill-switch, or news-based exit (live).
    # Churn (CRITICAL): 60–120 m band — tune; stops may still defer briefly after the open.
    # Stop-loss allowed unless avoid_stop_loss_first_minutes_after_open defers it after the open.
    min_hold_minutes: 60
    # Live only: defer risk-cap clip, overweight trim, and partial unrealized-P/L trim until min_hold_minutes.
    no_trim_before_min_hold: true
    avoid_stop_loss_first_minutes_after_open: 5
    # Full profit-booking exits: same-symbol re-entry cooldown (minutes); typical band 10–15.
    cooldown_after_profit_minutes: 15
    # Partial take-profit / partial P/L trim: shorter same-symbol re-entry only (minutes).
    cooldown_after_profit_partial_minutes: 2
    strong_trend_reconfirm_min_regime_score: 4
    # When true, skip the close>exit-price re-entry gate if MA stack + min regime score pass (see strong_momentum_reentry_ok).
    strong_momentum_bypass_profit_reentry_price: true
    # Superseded for price level by entries.allow_reentry_on_pullback + reentry_price_buffer_pct when that is true.
    require_price_above_exit_after_profit: false
    take_profit_pct: 3.0
    use_trailing_stop: true
    trailing_stop_pct: 1.25
    # Partial take-profit arm (%% unrealized). Prefer trigger_profit_pct; else partial_take_profit_pct (default 2).
    # When ``trim_winners_enabled``, ``trim_threshold_pct`` / ``trim_fraction`` replace the partial arm + exit ratio
    # (frees capital earlier on open winners vs a single high trigger).
    trigger_profit_pct: 2.5   # legacy partial arm; overridden when trim_winners_enabled
    partial_exit_ratio: 0.25
    trim_winners_enabled: true
    trim_threshold_pct: 1.5
    trim_fraction: 0.3
    # Live exit pass: trim toward target %% of equity per name; each cycle sells ``trim_aggressiveness`` × dollar excess.
    trim_on_overweight: true
    target_position_pct: 0.08
    trim_aggressiveness: 0.5
    time_bars_exit: 20
    # Optional: replaces legacy partial + trailing block in :meth:`TrendFollowingStrategy.check_exit` when enabled.
    smart_trailing:
      enabled: true
      activate_profit_pct: 3.0
      trail_pct: 2.0
      # When enabled, trail distance uses max(floor_pct, atr_pct * atr_mult); atr_pct = (ATR/close)*100.
      # If ATR is unavailable, falls back to trail_pct above.
      dynamic_trail_pct:
        enabled: true
        floor_pct: 1.5
        atr_mult: 1.2
      scale_out:
        - profit_pct: 5.0
          sell_pct: 0.25
        - profit_pct: 10.0
          sell_pct: 0.25
      # Churn: align with global min_hold (60–120 m); defers scale-out and smart trail until then.
      min_hold_minutes: 60
    kill_switch:
      mode: partial
      sell_fraction: 0.20
      max_spread_pct: 0.7
      max_atr_pct: 3.0
    # Long equity: when unrealized P/L > min_pnl_pct (%%) and daily structure still a strong long trend,
    # block discretionary sells (stops, kill-switch, trail unchanged). See src/live/exits.py.
    do_not_sell_winners_early:
      enabled: true
      min_pnl_pct: 2.0

    # Momentum fade: full exit when daily close falls below trend_following.ma_fast (optional RSI confirmation).
    momentum_fade:
      enabled: true
      close_below_fast_ma: true
      min_profit_pct: 0.0
      rsi_confirm:
        enabled: false
        period: 14
        below: 48

    # One partial trim per position after wall-clock minutes held (persists ``time_based_trim_done`` on tracker).
    time_based_trim:
      enabled: true
      after_minutes: 240
      trim_fraction: 0.2
      min_profit_pct: 0.0

breakout_module:
  enabled: true
  max_trades_per_day: 2
  max_total_exposure_pct: 6
  min_volume: 2000000
  min_price: 10
  take_profit_pct: 1.5
  strong_take_profit_pct: 2.5
  stop_loss_pct: 0.7
  trailing_stop_pct: 0.5
  max_hold_minutes: 60

# ---------------------------------------------------------------------------
# 2b) Portfolio cap & rotation (trend longs in live loop)
# ---------------------------------------------------------------------------
portfolio:
  target_core_stock_pct: 65
  target_dynamic_pct: 45
  target_cash_pct: 10
  dynamic_quality:
    enabled: true
    allow_event_news_fallback: true
    # dynamic_pure_momentum_allocator_v1: scanner-approved dynamic momentum
    # names can pass allocator quality without news/catalyst only when score,
    # RVOL, gain, and existing hard quote/spread safety are strong.
    allow_pure_momentum: true
    pure_momentum_min_score: 35
    pure_momentum_min_rvol: 0.8
    pure_momentum_min_gain_pct: 3.0
    pure_momentum_max_spread_pct: 2.5
    min_catalyst_score: 0.3
    min_event_score: 3.0
    min_news_score: 3.0
  # Lifetime cash contributions to the account. Daily report uses this baseline to show
  # cumulative profit and total return relative to the money you have put in so far.
  total_contributed_usd: 0
  # Hard gross kill-switches (no strong-signal relief): fraction of equity or %% points (90 → 0.90).
  # Allow gross toward 110%% in strong bullish regimes; keep hard stops above that band.
  hard_stop_new_entries_above_gross: 112
  hard_block_all_entries_above: 95
  # safe | balanced | aggressive | custom — preset overrides min_cash_reserve_pct / gross caps at load.
  # Use ``custom`` when setting explicit ``min_cash_reserve_pct`` / gross caps below (otherwise balanced forces 5%% reserve).
  risk_book_mode: custom
  # Per SYMBOL_SECTOR long-book cap vs equity (momentum / trend, not static ETF grid). Merges with risk.sector_cap_pct (stricter wins); see effective_max_sector_sleeve_pct.
  max_sector_pct: 0.42
  # Aggressive dynamic mode allows near-fully deployed stock gross exposure while
  # retaining hard stop-new-buys, reduce-only, emergency, and exit controls below.
  # Gross long MV / equity cap for position-sizing headroom (0–1 fraction, or percent >1 e.g. 95).
  # When set, overrides ``position_sizing.max_gross_exposure_pct`` (see src/position_sizing.py).
  # Precedence: ``max_gross_exposure`` → ``max_gross_exposure_pct`` → ``target_gross_exposure_pct``.
  # Align with exposure_gates.max_total_exposure_frac when tuning stop-new-buys gross band.
  max_gross_exposure: 1.00
  target_gross_exposure_pct: 1.00
  # Raised to 110%% of equity **only** when market regime leg is bullish and score ≥ 4 (see src/position_sizing.py).
  bullish_score_4_plus_max_gross_exposure_pct: 110
  # Partition deployable BP (after min-cash reserve): stock allocator / equity entries vs options premium budget.
  capital_split:
    enabled: true
    stocks: 0.70
    options: 0.30
  # If broker cash / equity × 100 is ≥ this, use scoring.when_high_cash and portfolio_brain.when_high_cash (0 = off).
  high_cash_deploy_pct: 30
  # Gross long MV / equity and technology sector sleeve (see src/exposure_gates.py, src/exposure.py).
  exposure_gates:
    enabled: true
    # Block allocator / entry buys when long gross MV / equity exceeds this fraction (operator stop_new_buys_above_gross_pct).
    # Aggressive dynamic mode lifts this to 95% so dynamic entries are not blocked too early.
    max_total_exposure_frac: 0.95
    max_tech_sector_exposure_frac: 0.4      # when technology sector / equity > this, scale new tech entries
    tech_over_cap_size_multiplier: 0.5      # multiply regime size multiplier for new entries in technology only
    # When true, live loop trims a slice of the weakest long (rebalance_free_capital band) if gross / equity
    # exceeds the effective cap (adaptive + base; no per-entry strong-signal gross relief). See run_alpaca_loop.
    force_trim_weakest_when_over_max: true
    # When gross long MV / equity exceeds this (fraction, default 1.0 = 100%): **mode: reduce_only** in the
    # live heartbeat; block new long entries in TradingEngine; skip bear/Inverse buys; skip symbol/allocator buys.
    overexposed_reduce_only: true
    overexposed_reduce_only_gross_frac: 1.08
    # Trim order size to fit headroom under gross / portfolio budget caps instead of hard-rejecting when near cap.
    soft_cap:
      enabled: true
  # Composite strength ≥ min_strength: slightly exceed gross exposure cap (+extra_gross_exposure_frac)
  # and bypass early max-positions skips in run_alpaca_loop (TradingEngine applies the gross relief too).
  # When relief_symbols is set, relief applies only to those tickers; omit it for all symbols.
  strong_signal_cap_relief:
    enabled: true
    min_strength: 0.82
    extra_gross_exposure_frac: 0.02
    # Gross-cap + early max-position relief only for these tickers (strong signal ≥ min_strength).
    relief_symbols:
      - SPY
      - NVDA
  # Live loop (run_alpaca_loop): max new trades per user pass (options + stock); add-ons with allow_add skip cap.
  # See MAX_NEW_TRADES_PER_LOOP in src/portfolio_replacement.py (default 3).
  # Long stock market value (ex-options) + new buy ≤ this % of equity (see src/portfolio_allocation.py).
  # Deployable buying power for new stock entries ≤ equity × (1 − reserve) (also capped by broker BP).
  # Decimal in (0,1) = fraction (0.10 → 10%); integer ≥1 = percent points (10 → 10%). See min_cash_reserve_frac.
  # Ignored when ``allocator.mode: dynamic_risk_budget`` (use ``allocator.cash_buffer_pct`` instead).
  min_cash_reserve_pct: 12
  # When true, each entry scan: if broker cash %% of equity < min_cash_target (see tolerance), one weakest-long trim (rebalance_free_capital band). When false, no proactive per-scan cash lift.
  rebalance_each_cycle: false
  # Target floor for broker cash %% of equity (integer = percent points; fraction 0–1 = decimal). Drives ``rebalance_each_cycle`` trim.
  min_cash_target_pct: 8
  # Cash %% of equity trim threshold = ``min_cash_target_pct`` minus this (percent points; ``0`` = strict).
  rebalance_tolerance_pct: 3
  # Ignored when ``allocator.mode: dynamic_risk_budget`` (stock sleeve = 1 − options sleeve; see :mod:`src.dynamic_risk_budget`).
  max_stock_capital_pct: 60
  # Effective options premium cap = min(this %, options.total_exposure_limit / legacy max_total_options_exposure_pct) × equity.
  max_options_capital_pct: 40
  # Distinct long equity names cap — top-N stock book (live loop; rotation at cap when enabled).
  # Limit open names to reduce overlap and execution churn.
  # Omitting max_positions defaults to 10, or ``portfolio.allocator.max_positions`` when set (see max_portfolio_positions_from_config).
  max_positions: 10
  # Rank by ``portfolio.replacement.weakest_pick`` (same as rotation): keep top *N* names, full-exit
  # the rest (worst first; *max_sells_per_pass* per heartbeat). *top_n* 0 = *max_positions* above.
  rank_based_holding:
    enabled: true
    top_n: 8
    max_sells_per_pass: 1
  # Min score gap for rotation when replacement.replacement_threshold is NOT in (0, 1):
  # new signal score must exceed weakest position score by this much (see portfolio_score_replacement).
  swap_threshold: 10
  # When true and at max_positions, still scan symbols you already hold for add-on stock buys (uses merge on tracker).
  # Informal synonym some operators use: allow_add_to_winners — same flag (pyramid adds on existing longs / tracker).
  allow_add: true
  # When false: for symbols already held or on tracker, treat allow_add as true only if strong daily trend
  # (strong_trend_reconfirm_ok when strategy.exits.strong_trend_reconfirm_bypass_cooldown; else MA/regime structure
  # via strong_momentum_structure_ok). With headroom: allow add below cap. Without headroom: enable ``pyramid_into_winners``
  # (strong trend + min unrealized profit %%) to bypass the %% cap gate and widen sizing.
  allow_add_on_strong_momentum: false
  # When ``allow_add_on_strong_momentum`` is true: if already at/near the per-name %% cap, still allow an add
  # when daily structure is strong **and** unrealized P&L %% vs cost basis ≥ threshold (widens sizing via ``cap_relax_multiplier``).
  pyramid_into_winners:
    enabled: false
    min_unrealized_profit_pct: 5.0
    cap_relax_multiplier: 1.15
  # When sizing rejects with ``portfolio caps leave no room``, trim the **weakest** eligible long(s) first
  # (replacement strength; same as rotation) by ``trim_frac`` (10–20% band; default 15%) before rotating out
  # a full weakest line — frees gross for the new entry. Use with ``allocation.rank_by_signal_strength: true``
  # so the scan prioritizes the strongest new signals (Top-K).
  cap_pressure_trim:
    enabled: true
    trim_frac: 0.15
    max_symbols_per_cycle: 6
  # Rank-by-strength queue: if the **top** candidate fails dispatch (gates / BP / caps), optionally
  # trim one weakest held line (``trim_frac``, same band as ``cap_pressure_trim``) then retry that
  # symbol once — favors funding the strongest signal vs falling through to lower-ranked names.
  ranked_capital_reallocation:
    enabled: false
    trim_frac: 0.15
  # Extra pyramid-add gates (live loop only): when ``enabled``, an add-on requires
  # ``entry_signal.strength`` > ``min_signal_strength`` AND long market value < ``max_scaled_position_usd``
  # (set USD cap to 0 to skip the size check). Ignored for net-new positions.
  add_on:
    enabled: false
    min_signal_strength: 0.60
    # Existing-position strong-signal adds are small by design: cap each add to 1–2% of equity.
    incremental_add_pct: 0.02
    max_scaled_position_usd: 0
  # **Default: ``enabled: false``** — one stock entry path: ``run_entry_gates`` → BP / ranking →
  # ``dispatch_trend_long_after_buying_power``. Set ``enabled: true`` for the allocator path
  # (``execute_capital_allocator_pass``). With ``options.enabled`` and new option entries on, the live loop
  # routes trend-longs with ``strength_eff > execution.strong_signal_strength_min`` to
  # ``dispatch_trend_long_after_buying_power`` (options or stock) and only ``strength_eff`` at/below
  # that to the post-scan **equity** allocator batch. ``min_trade_size`` is the base tranche; ``min_realloc_leg`` drops
  # sub-$ rotation/new-leg notionals in the allocator and at submit (see :mod:`src.capital_allocator`).
  capital_allocator:
    enabled: true
    allow_stock_fallback_if_options_fail: true
    allow_add_ons: true
    add_on_signal_threshold: 0.55
    # Let the allocator return [] when candidates are not worth buying; forced buys are opt-in only.
    allow_no_trade_cycles: false
    selected_must_execute: true
    force_deploy_when_candidates_exist: true
    max_positions: 10
    # Per-name % of equity: optional **soft** / **hard** default band for symbols **not** listed in tier
    # buckets. Tier keys ``leaders`` → ``core`` → ``defensive`` (or under ``tiers:``) set per-ticker **hard**
    # caps (first bucket wins if duplicated). Optional ``bullish_soft`` / ``bullish_hard`` when regime is bullish.
    # Legacy: ``base`` / ``bullish_regime`` (single line). Merged (stricter wins) with ``portfolio.max_single_position_pct``
    # / risk per-name cap. ``regime_<n>`` (exact score): relax/tighten for that score (replaces ``risk.max_symbol_allocation_pct`` in the merge).
    # Per-name %% of equity (merged stricter with risk.max_symbol_allocation_pct). Operator alias: max_symbol_allocation_pct.
    symbol_caps:
      soft: 0.15
      hard: 0.18
      regime_4: 0.20
      leaders:
        NVDA: "22%"
        MU: "22%"
        SMH: "18%"
        PLTR: "18%"
        AMD: "18%"
        SPY: "22%"
        QQQ: "22%"
      core:
        IWM: "22%"
        DIA: "6%"
      defensive:
        WMT: "4%"
        KO: "3%"
    min_trade_size: 750
    min_trade_notional: 750
    min_signal_strength: 0.30
    min_realloc_leg: 1200
    minimum_cash_to_deploy_pct: 0.03
    # Cap each BUY leg: min(equity × %%, $ cap). Operator: max_single_order_notional_pct / max_single_order_notional.
    max_single_order_notional_pct: 0.12
    max_single_order_notional: 5000
    # Allocator-only: drop BUY legs when gross long MV / equity **fraction** is strictly above this.
    refuse_to_allocate_if_gross_above: 0.90
    # Before broker submit: net buy/sell notionals per symbol; omit legs with |net| < min (default = min_realloc_leg).
    consolidate_net_before_submit: true
    # min_net_notional: 500   # optional override; omit to use min_realloc_leg
    rotate_trim_fraction: 0.30
    # Full book / swap path: rotate only when incoming book strength clearly beats weakest × ratio (default 1.2 ⇒ need ~20%% edge vs held line).
    replace_weakest_with_stronger: true
    replacement_strength_ratio: 1.2
    # CRITICAL "sell only if needed": rebalance trims (and rotate) require incoming score strictly above the sourced line (rotate_capital); avoids selling a stronger hold to fund a weaker buy.
    sell_only_if_needed: true
    # One allocator execute per heartbeat; ``allocate()`` uses a BP snapshot taken immediately before
    # the pass (not cash mutated during the symbol scan). When true (default), skips the legacy
    # ``post_sell_reallocation`` second execute in the same tick (equal-split redeploy defers to next cycle).
    single_pass_per_cycle: true
    # After an equity **sell** in the same loop tick, second pass: rank post-scan candidates and
    # equal-split **remainder** buying power (after the main allocator) across top ``split_n`` names
    # (``remainder / n`` per leg). Set ``require_equity_sell: false`` to allow split without a sell.
    post_sell_reallocation:
      enabled: false
      require_equity_sell: true
      min_freed_cash: 1.0
      split_n: 5
    # After an equity sell: for this many **minutes**, allocator ignores the soft–hard tranche and only
    # enforces the **hard** per-name line (``0`` = never). See :meth:`src.live.exits.LiveExitContext.recent_sell_within`.
    ignore_soft_caps_after_sell_minutes: 5
    # **Rebalancing:** if deployable cash is short for a tranche, sell this fraction of the **lowest-score** held
    # line to fund the buy; rotation swaps also use this full fraction (not capped at ``min_trade_size``) when on.
    rebalance_fund_from_weakest: true
    rebalance_weakest_trim_fraction: 0.30
    # No net notional add from the allocator: trim buys so sum(sells) >= sum(buys). Set false to allow net buys.
    require_net_sell_gte_buy: true
    # When long gross (%% of equity) is at least this fraction of the **effective** max (regime / entry-wave
    # aware, same as exposure gates), also cap aggregate buys at net_reduction_max_buy_to_sell_ratio × aggregate sells
    # (0.5 ⇒ buys ≤ half of sells). Set net_reduction_near_cap_relative_to_max: 0 to disable this stricter pass.
    net_reduction_near_cap_relative_to_max: 0.9
    net_reduction_max_buy_to_sell_ratio: 0.5
    # Risk override: when book gross (long MV / equity) is above this **fraction** (0.95 = 95%%, YAML may use 95 or 0.95), use ``mode: risk_control``; by default buys are not submitted (same as over-max-gross).
    risk_control_gross_frac: 0.95
    risk_control_block_buys: true
    # Under-invested: when long gross (%% of equity) is **strictly below** this fraction, allocator ``mode: deploy`` (favor deployment; not risk_control). Set ``0`` to always use ``normal`` when not over risk threshold.
    min_gross_deployment_pct: 0.80
    # If ``regime_score == 4`` and gross (fraction of equity) is **below** ``min_gross_deployment_pct``,
    # set force_allocate: skip ``require_net_sell_gte_buy`` so buy-only plans are not fully stripped (reaches min deploy).
    bullish_force_minimum_deploy: true
    # In ``deploy`` mode, only the top *N* candidates by ``score`` (3–5) are sent to the allocator, then notional is allocated.
    deploy_top_n_signals: 3
    # Top ``top_n`` ranked signals (by ``score``) get a larger **tranche** (``min_trade_size`` scale); the rest a smaller one.
    # See :func:`src.capital_allocator_loop.rank_allocator_candidates` and :class:`src.capital_allocator.CapitalAllocator`.
    concentration_bias:
      enabled: true
      top_n: 2
      top_tranche_scale: 1.75
      rest_tranche_scale: 0.50
    # If the plan is still empty: equal-split *cash* across top ``empty_alloc_top_n`` by ``score`` (BUY each), then apply_cooldown.
    empty_alloc_top_n: 3
    # Operator alias: allocator.enable_equal_split_fallback — equal-split top-N when allocate() returns empty.
    fallback_on_empty_alloc: true
    etf_fallback_enabled: false
    etf_fallback_max_notional_pct: 5
    etf_fallback_only_when_no_news_candidates: true
    # When ``fallback_on_empty_alloc`` is off (or equal-split/cooldown yield no rows) and exactly one
    # candidate remains, synthesize one BUY at max(ref price, ``min_realloc_leg``) so the line is not dropped.
    force_minimum_trade_single_candidate: true
    # Idle fallback is intentionally capped below the main book cap so fixed-size placeholder BUYs
    # do not consume capacity needed by later dynamic-scan entries.
    idle_fallback:
      enabled: false
      max_gross_pct: 85
      prefer_dynamic_symbols: true
    # Re-rank signals: favor underweight sector/theme sleeves and light theme overlap vs re-scaling held names (e.g. SPY/SMH adds after a trim).
    prioritize_diversification: true
    diversification_reentry_scale: 0.55
    diversification_sector_weight: 0.35
    diversification_theme_weight: 0.35
    # %% of equity in a sleeve at which extra “underweight” boost tapers off (see :func:`reorder_allocator_candidates_diversification`).
    diversification_reference_exposure_pct: 30.0
    # Bullish / high-score regimes: slash allocator ``score`` on staples/defensive names so they don’t lead deploy (reduces defensive drift).
    defensive_drift:
      enabled: true
      regime_min_score: 4
      priority_scale: 0.15
      symbols: [KO, PEP, PG, XLP]
      match_sector_substrings: [staple, defensive, utilities]
      match_theme_substrings: [defensive, staple, utilities, consumer_staples]
  # Single-symbol stock cap vs equity (percent points, ``"8%"``, or ``dynamic`` + ``symbol_allocation_cap_dynamic``).
  # Align with ``capital_allocator.symbol_caps.hard`` so the merged cap is not stricter than allocator hard.
  max_single_position_pct: 22.0
  # Optional equity-aware cap; used only when ``symbol_allocation_cap`` is ``dynamic`` (omit cap above).
  symbol_allocation_cap_dynamic:
    # Used only when symbol_allocation_cap is ``dynamic``: cap = min(max_pct, max(floor_pct, 100×min_trade_usd/equity)).
    max_pct: 25
    min_trade_size_usd: 1000
    floor_pct: 25
  # Legacy: if set and symbol_allocation_cap is omitted, this is used instead.
  # max_allocation_per_symbol: "25%"
  # If set, only these tickers may receive stock BUY orders (trend longs, inverse ETF adds/scaling).
  # Omit for no restriction. List bear tickers (e.g. SQQQ) if you use them with an allowlist.
  # allowed_symbols_for_stock_orders: []
  # Structural fix vs book freeze: prefer rotation (replacement) over only loosening caps / relief.
  # At max names, dispatch still evaluates weakest vs incoming (at-cap path) even if this is false.
  # For **sizing-reject** recovery (``consider_replacement_for_sizing_reject``): when the reject is
  # not the book-level message ``portfolio caps leave no room``, full-line rotation is skipped unless
  # ``enable_replacement: true`` — reduces unnecessary sells (e.g. per-name cap) on symbols like staples.
  enable_replacement: true
  replacement:
    # Recommended immediate operator set: threshold 0.25, jitter 0.05, stale-after 8d, $750 min lot/incoming,
    # max 1 replacement per entry scan, no equal-strength swap (see portfolio_replacement / portfolio_score_replacement).
    # Weakest hold must be at least this many minutes old (tracker entry_time) before rotation sell (0 = off).
    # Churn (CRITICAL): 60–120 m band — tune with global strategy.exits.min_hold_minutes.
    min_hold_minutes: 60
    # When true: at max positions, sell weakest and buy new if new signal score > weakest (no extra gap vs
    # replacement_threshold / swap_threshold). Still enforces min_hold, size mins, replacement_strength_ok.
    rotate_on_stronger_signal: true
    # In (0, 1): incoming jittered strength must exceed weakest tracked signal_strength by at least this (non-stale).
    replacement_threshold: 0.25
    strength_jitter_max: 0.05
    # If weakest hold bars_held > this, allow replacement even when new strength ≤ weakest (live: calendar days).
    replace_if_weakest_older_than_bars: 8
    # Weakest must be at least this many bars_held (calendar days in tracker) before it may be rotated out.
    max_position_age_bars: 20
    # Disabled by default: preserve young-position protection unless an operator
    # explicitly permits exceptional score-gap replacement.
    young_position_exceptional_override:
      enabled: false
      min_strength_gap: 0.50
      min_incoming_strength: 0.85
    allow_equal_replacement: false
    min_market_value_to_replace_usd: 750
    min_notional_for_incoming_usd: 750
    max_replacements_per_entry_cycle: 3
    # 1.0 = one market sell (full exit) before the new buy. (0,1) with default: two legs = full exit in two orders.
    # When ``rotate_partial_replacement: true`` and tranche in (0,1): only the first tranche is sold; the rest
    # of the line stays open; the new buy is **notional-capped** to ``min(planned, est. proceeds)``.
    rotate_sell_tranche_fraction: 1.0
    rotate_partial_replacement: false
    # Strength-swap only: sell up to ``max_sells`` laggards (weakest first) to fund a strong new name
    # (e.g. XLF+WMT → NVDA) instead of rotating a single line. ``prefer_sell_count: 0`` = stop when
    # cumulative market value covers ``min(incoming notional, min_notional_for_incoming_usd)``; set 2
    # to always sell two names when two qualify. ``enabled: false`` = one-weakest behavior.
    replace_losers_with_winners:
      enabled: false
      max_sells: 2
      prefer_sell_count: 0
    # Weakest eligible hold for rotation / RFC: ``entry_signal_strength`` (default, persisted entry strength);
    # ``pnl_momentum_trend`` / health — *mean* of pnl_leg + momentum + trend on [0,1] from daily bars; or
    # ``composite_position_score`` (aliases: ``weakest_simple``, ``momentum_pnl_trend_strength_sum``) —
    # *unweighted three-term sum* on [0,3]; *lowest* = weakest.
    weakest_pick: entry_signal_strength
    # Score-based replacement only (``replacement_threshold`` not in (0,1)): ``classic`` = score_position 0–100;
    # ``weighted_position`` = min(eligible, key=weighted composite 0–1), scaled to 0–100 vs score_signal.
    swap_position_score: classic
    # ``default`` — strength gap or score swap per ``replacement_threshold``; ``min_unrealized_pl_vs_signal`` —
    # weakest eligible long by min unrealized P/L %% vs incoming strength (see consider_replacement).
    strategy: min_unrealized_pl_vs_signal
    # Churn guard (min_unrealized_pl_vs_signal): replace only if new_strength > weakest_strength * ratio.
    # Set to 1.0 to disable margin. Omit for default 1.2.
    churn_guard_min_new_vs_weakest_ratio: 1.2
    # When OHLCV is available, min_unrealized_pl_vs_signal also requires is_stronger(sig, pos):
    # trend, momentum, pullback, and weakest unrealized P/L fraction < 1.0 (see portfolio_replacement).
    # Legacy override for score-gap (prefer portfolio.swap_threshold).
    # swap_score_threshold: 10
  # When a new entry is blocked by buying power: optionally sell a fraction of the weakest tracked
  # eligible long (same weakest logic as replacement) to free cash, then retry (see src/rebalance_free_capital.py).
  # Informal synonym some operators use: rebalance_on_signal — trim-to-fund when pursuing a new entry on low BP.
  rebalance_free_capital:
    enabled: true
    # weakest = lowest replacement / signal score; largest_exposure_notional = abs broker market_value desc, try N (see largest_exposure_max_try).
    trim_target: largest_exposure_notional
    largest_exposure_max_try: 3
    # When enabled: notional market sells on top `market_value` lines (e.g. $1500 x 3) instead of many small-share trims. Needs max_trims_per_entry_scan >= max_symbols.
    bulk_trim:
      enabled: true
      notional_per_symbol_usd: 1500
      max_symbols_per_pass: 3
      # Post–bulk-trim buy cooldown (operator rebalance_cooldown_minutes; mitigates chasing after RFC trims).
      buy_cooldown_minutes: 120
      # After any enabled bulk notional sell, the post-scan capital allocator is skipped for the **next** main loop pass (one cycle) for that user (``run_alpaca_loop`` only).
    # New entry but insufficient BP: sell a slice of the mapped eligible long (weakest or largest notional), refresh BP, retry.
    # run_alpaca_loop: slice size is **not** this band — it uses gross-book tiers (0.6 / 0.4 / 0.25 of position when
    # gross/eq >1.05 / >1.0 / else) via :func:`src.rebalance_free_capital.trim_fraction_by_gross_leverage`. The
    # keys below still apply to :func:`rebalance_trim_fraction_for_attempt` for other callers and documentation.
    # Trim band as %% of position shares; trim_band_uniform true = random in [min,max] each trim, false = midpoint only.
    trim_pct_min: 20
    trim_pct_max: 30
    trim_band_uniform: true
    # trim_fraction: 0.15   # optional 0–1 override; ignored if trim_pct_min/max are set
    max_trims_per_entry_scan: 3
    exclude_incoming_symbol: true
    # After partial trims: if still short on BP, fully exit the weakest long when incoming composite
    # strength (same as signal ranking) is strictly greater than that position's stored signal_strength.
    # Runs when true regardless of ``rebalance.trigger`` tokens (see plan_full_exit_weakest_when_stronger).
    rotate_full_weakest_when_stronger: true
    # When bulk_trim and gross_liquidation are both enabled, gross-cap over-max uses **bulk** notional lines; share-based de-lever plan is skipped that cycle.
    # When enabled, exposure_gates gross-cap trim (over max book) sells **toward** target long gross as %% of equity
    # (same scale as ``compute_exposures`` gross_pct) by **notional gap / passes** per live cycle, not a fixed %% of the line.
    # E.g. book 107% vs target 95% with passes=2 → about half the 12%%-of-equity gap in $ from the chosen name per trim.
    gross_liquidation:
      enabled: true
      target_gross_pct: 95.0
      passes: 2
    # Top *n* eligible lines by |market_value|: apply a smaller trim / bulk notional (intensity) so core names
    # are reduced **less aggressively** (see :func:`src.rebalance_free_capital.get_top_n_positions`).
    top_position_protection:
      enabled: true
      n: 3
      intensity_mult: 0.5
    # First RFC partial trim in an entry scan: skip lines with unrealized PnL %% above this vs |cost_basis| (winners). 0 = off.
    first_pass_winner_pnl_skip_pct: 3.0
    # Pro-style gross de-lever when book > effective cap: (1) ~50%% of weakest, (2) if still over — full exit weakest, (3) if still over — pro-rata notional trims. When true, the gross-cap path does **not** run bulk/legacy in the same handler.
    two_phase_gross_cap_unwind:
      enabled: false
      phase1_weakest_trim_fraction: 0.5
      proportional_max_submits: 25
  # Tie-break when strengths are equal (top-N plan, deferred replacement merge). Earlier = higher priority.
  priority_symbols: ["SPY", "NVDA", "MSFT", "SMH"]
  # Operator aliases for underinvestment policy: when the live gross long book is below this fraction,
  # allocator deploy mode engages; ``force_deploy_if_signals`` maps to
  # ``capital_allocator.bullish_force_minimum_deploy`` when the nested key is unset.
  min_deploy_pct: 0.80
  force_deploy_if_signals: true
  # Phase-1 portfolio brain (see src/portfolio_brain.py): structured gate before options/stock routing.
  portfolio_brain:
    enabled: true
    # When high_cash_deploy_pct triggers: multiply concentration ceilings (1.0 = no change; cap 3.0 in code).
    when_high_cash:
      bucket_cap_mult: 1.1
      symbol_cap_mult: 1.1
      sector_exposure_mult: 1.1
  # Operator-friendly alias for ranked top N when ``signal_ranking.max_signals_per_loop`` is omitted.
  allocator:
    # ``refuse_to_allocate_if_gross_above`` may live here as fallback when omitted under ``capital_allocator``.
    # ``dynamic_risk_budget`` — soft bucket targets + cadence; bypasses rigid max_stock / fixed reserve
    # / separate inverse YAML (hedge bucket → inverse cap). Rebalance tick logs in ``run_alpaca_loop``.
    mode: dynamic_risk_budget
    rebalance_frequency: 15m
    # Optional: %% of equity held back as cash for deployable-BP (replaces min_cash_reserve_pct in DRB mode).
    cash_buffer_pct: 0
    buckets:
      core_trend: { target: 40 }
      momentum: { target: 25 }
      mean_reversion: { target: 15 }
      hedge: { target: 10 }
      opportunistic: { target: 10 }
    type: ranked
    max_positions: 10
    top_n_signals: 3
    top_n: 6
    # Max gross book increase in one allocator pass: min(book cap, current gross + this × equity). Omit for no per-cycle ramp limit.
    max_gross_increase_per_cycle: 0.05
    # When ``soft_cap_mode``, per-symbol $ cap (``capital_allocator.symbol_cap``) uses reduced adds instead of skipping: ``min_trade_size * cap_penalty_multiplier``; also clamps when a full min would break the cap.
    soft_cap_mode: true
    cap_penalty_multiplier: 0.5
    # A sleeve at its per-bucket MV cap may still add if other sleeves (e.g. ``mega_cap_beta``) are below cap — borrow unused capacity in aggregate.
    allow_cross_bucket_rebalance: true
  # Rank passing signals each scan; **cap** is ``effective_ranked_signals_cap`` (Top-K when
  # ``allocation.rank_by_signal_strength``). This key applies when that flag is false.
  # When ``allocation.rank_by_signal_strength`` is **true**, ``ranking_mode`` is ignored for Top-K; use ``allocation.rank_top_k_by`` instead.
  # ranking_mode: tier_then_strength — SPY/QQQ > NVDA/MSFT > sector ETFs > others, then strength_eff (only if Top-K uses legacy path).
  # ranking_mode: momentum_rs_volume — same pillar triple as allocation.rank_top_k_by when not using strength Top-K.
  # ranking_mode: composite_score — weighted pillars (composite_weights), top N.
  # ranking_mode: signal_priority — unweighted sum trend+momentum+volatility_expansion+relative_strength (each [0,1], max 4).
  signal_ranking:
    enabled: true
    # Fallback cap when ``allocation.rank_by_signal_strength`` is false (else Top-K uses ``allocation.allocate_top_n``).
    max_signals_per_loop: 5
    # Used for composite_score mode and trend_long_composite_rank / strength_eff denominator.
    composite_weights:
      trend_strength: 0.35
      momentum: 0.30
      volatility_expansion: 0.10
      relative_strength: 0.25
    ranking_mode: signal_priority
    # Event-driven composite bonuses (+1 each when fired); see src/signal_ranking.trend_long_composite_rank
    event_triggers:
      enabled: true
      volatility_breakout:
        enabled: true
        atr_multiple: 1.5          # today ATR%% > multiple × mean ATR%% over prior baseline_bars (excl. today)
        baseline_bars: 20
      volume_anomaly:
        enabled: true
        volume_multiple: 2.0       # last volume > multiple × mean volume over prior avg_volume_bars (excl. today)
        avg_volume_bars: 20
    # Open long with entry / last add within recent_minutes → lower rank vs other signals (tier + weaker sort keys).
    recent_add_priority:
      enabled: true
      recent_minutes: 2880         # e.g. 48h wall-clock — see position_tracker.last_entry_within
      strength_eff_multiplier: 0.72
      composite_score_multiplier: 0.72
      extra_priority_tier: 1       # add this many tier buckets toward “other” (capped at bottom tier)
    # sector_etf_symbols: []  # optional extra tickers merged into default sector-ETF set
  # Batch mode: collect passing trend-long stock signals this scan, then rank (fresh ∪ held), keep top
  # max_positions, sell demotions, buy promotions in strength order. Fresh ranks use composite score
  # (trend_strength + momentum + pnl_potential) / denom + optional replacement jitter; held
  # names use tracked signal_strength + jitter (see src/signal_ranking.py). When enabled, per-symbol
  # replacement above is skipped for stocks; options routing unchanged. Conflicts with incremental
  # allow_add adds in the same pass — prefer allow_add: false or leave top_n disabled.
  top_n_by_strength:
    enabled: false

# ---------------------------------------------------------------------------
# 3) Position Sizing
# ---------------------------------------------------------------------------
position_sizing:
  # Operator aliases for the live loop add-on gate: ``allow_add_to_winners`` maps to
  # ``portfolio.allow_add`` and ``max_positions_per_symbol`` maps to
  # ``risk.max_adds_per_symbol_per_day`` as ``max_positions_per_symbol - 1`` when the risk key is unset.
  # ``add_on_strength`` enables the existing ``portfolio.add_on`` strength gate for add-ons.
  # ``add_on_signal_threshold`` maps to ``portfolio.add_on.min_signal_strength``.
  # ``base_position_pct`` drives the strategy_v2 baseline size as the effective operator alias.
  base_position_pct: 0.08
  allow_add_to_winners: true
  max_positions_per_symbol: 3
  add_on_strength: true
  add_on_signal_threshold: 0.60
  # Small-fill USD floor when ``small_fill.min_trade_value`` is omitted (alias of ``small_fill.min_trade_value``).
  min_trade_dollars: 750
  # Larger risk budget per new line (high conviction, fewer names).
  risk_per_trade_pct: 0.70
  max_open_risk_pct: 3.0
  # Fallback per-name % cap when portfolio symbol cap is off (0). Otherwise sizer uses
  # effective portfolio + risk merged cap (same as live skip gate).
  max_exposure_per_symbol_pct: 22
  max_symbol_exposure_pct: 12.5
  max_position_pct: 0.22
  # ~$25k: allow ~$3.5-4.0k in one name (pair with max_single_position_pct in portfolio).
  max_position_dollar_cap: 6000
  # Fallback when ``portfolio.max_sector_pct`` and ``risk.sector_cap_pct`` are unset; merged in effective_max_sector_sleeve_pct.
  max_exposure_per_sector_pct: 30.0

  # Floor / aim for new-line size as fraction of equity (``0.08``) or percent points (``8``); uses the larger of the two.
  min_position_pct: 0.10
  target_position_pct: 0.15
  # Minimum target notional per new line (reserved for future sizer / allocator alignment).
  min_position_dollar: 2000
  # If sized shares < 1 but symbol/portfolio headroom (USD) is >= min_trade_value and covers one share, size to 1.
  # Legacy key: min_trade_value_usd (same meaning as min_trade_value). Top-level ``min_trade_dollars`` used when omitted.
  small_fill:
    enabled: true
  # When cap **remaining** is positive but less than one share at *price*, risk still wants ≥1 share:
  # do not reject with ``symbol cap remaining yields zero shares`` — size one share (default) or full risk (``full_risk``).
  micro_cap_relief:
    enabled: true
    mode: one_share

  # After risk + symbol-cap shares: shares ← round(shares × confidence_score) when enabled.
  # confidence_score = trend_strength + momentum_strength + volume_signal (each 0–1; same bars as composite rank).
  # Requires callers to pass daily OHLCV into PositionSizer (trading engine / backtest / live bear paths do).
  confidence_sizing:
    enabled: true
    # When true, skip the extra trend/momentum/volume share multiply if signal_strength_mapping is proportional
    # (avoids double-scaling with composite entry strength).
    suppress_when_signal_strength_proportional: true
    momentum_bars: 10
    volume_bars: 20
    # ma_slow: 200   # optional override; else strategy.trend_following.ma_slow

  # Book-level caps (gross overridden by ``portfolio.max_gross_exposure`` when that key is set).
  max_gross_exposure_pct: 100.0
  max_net_exposure_pct: 90.0
  max_etf_exposure_pct: 45.0
  max_inverse_etf_exposure_pct: 15.0
  # Fallback max theme book %% when a theme is not listed under ``sector_caps`` (or ``sector_caps`` omitted).
  max_theme_exposure_pct: 40.0
  # Per-theme %% of equity cap for portfolio budget trim (``src.exposure.THEME_MAP`` buckets).
  # ``tech`` applies to ai_growth + semis + high_beta_growth; ``others`` covers unlisted themes (e.g. financials, china, hedge).
  sector_caps:
    broad_index: 60
    tech: 50
    others: 40

  # First ``top_n`` names in a ranked entry batch (best signal first) are *top signals*: multiply
  # shares / notional and rebuild the buy order (see src/winner_allocation.py). Unranked path unchanged.
  winner_allocation:
    enabled: true
    top_n: 2
    size_multiplier: 1.75
  # ATR-dollar risk unit: shares ≈ min(risk_budget / (price×ATR%×multiple), cap_remaining/price).
  # Higher ATR% → smaller size at the same risk budget (volatile names size down vs stable ETFs).
  volatility_sizing:
    enabled: true
    atr_risk_multiple: 1.0
    # affine: map strength [0,1] between conviction_min_scale and conviction_max_scale.
    # proportional: risk budget multiplier ≈ strength (with signal_strength_floor); allocation ∝ signal_strength.
    signal_strength_mapping: proportional
    signal_strength_floor: 0.06
    conviction_min_scale: 0.5
    conviction_max_scale: 1.50
  # Scale risk budget down as long-stock book fills (vs equity × max_exposure_frac_for_heat).
  portfolio_heat:
    enabled: true
    max_exposure_frac_for_heat: 0.60
    min_risk_scale_at_full_heat: 0.25
  # Position sizing reduction during high volatility regimes
  high_vol_reduction:
    enabled: true
    atr_pct_threshold: 2.0     # when ATR% (14d) > this, reduce size
    size_multiplier: 0.5       # multiply shares by this (e.g. half size)

  # Dynamic multipliers (drawdown / conviction / strategy health); reserved for sizing pipeline.
  dynamic_sizing:
    enabled: true

    drawdown_scaling:
      dd_3_pct: 0.85
      dd_5_pct: 0.70
      dd_8_pct: 0.50

    conviction_scaling:
      strong: 1.15
      medium: 1.00
      weak: 0.70

    strategy_health_scaling:
      cold_threshold_winrate: 0.40
      hot_threshold_winrate: 0.60
      cold_multiplier: 0.75
      hot_multiplier: 1.10

leader_overrides:
  symbols: ["SMH", "NVDA", "GOOGL", "AMZN", "SPY"]
  max_symbol_exposure_pct: 15

# ---------------------------------------------------------------------------
# 4) Portfolio & Drawdown
# ---------------------------------------------------------------------------
portfolio_risk:
  # Live loop: daily_pnl_pct = (equity - last_equity) / last_equity from the broker snapshot.
  # When true, record_trade / record_order_activity do not add realized %% on top (avoids double-count vs MTM).
  live_daily_pnl_from_equity_snapshot: true
  # Max loss as a positive %% magnitude; trading stops when daily_pnl_pct <= -max_daily_loss_pct.
  max_daily_loss_pct: 3.0
  # Legacy (ignored if max_daily_loss_pct is set): negative threshold, same semantics.
  # daily_loss_limit_pct: -2.0
  max_drawdown_pct: -10.0
  safe_mode_after_max_dd: true
  recovery_criteria_pct: -8.0   # resume live after drawdown recovers to this
  max_trades_per_day: 20
  # Per-symbol order cap (see ``risk.max_trades_per_symbol_per_day`` — merged; blocks **entries** via engine gates).
  max_trades_per_symbol_per_day: 4
  # Full exit → round trip; see ``risk.max_round_trips_per_symbol``.
  max_round_trips_per_symbol: 2

# ---------------------------------------------------------------------------
# 4b) Regime position sizing (bullish / neutral multipliers)
# ---------------------------------------------------------------------------
# Overrides ``market_regime.size_multipliers.bullish`` / ``neutral`` / ``defensive`` when set (see src/market_regime.py).
regime:
  neutral_size_mult: 1.0
  bullish_size_mult: 1.25

# ---------------------------------------------------------------------------
# 4c) Market regime score (adjust position size by regime)
# ---------------------------------------------------------------------------
# Score 0–5: regime_score = trend_score + volatility_score + breadth_score + macro_score
# (SPY/QQQ vs MA, VIX proxy vs threshold, HYG vs MA, TLT vs MA — see src/market_regime.py).
# Condition labels (bullish/neutral/defensive) still drive size_multiplier below; entry_policy maps score to SQQQ vs long stance.
market_regime:
  enabled: true
  # Regime score >= this: allow higher ATR on entries, relaxed volatility DNT, skip high-vol position size haircut (see strategy / trade_filters / position_sizing).
  allow_high_volatility_min_regime_score: 3
  symbols:   # Market Regime group (detect only; not in trade universe)
    spy: SPY
    qqq: QQQ
    vix: VIXY       # volatility proxy; raise vix_threshold if using VIXY (e.g. 25)
    hyg: HYG
    tlt: TLT
  ma_period_trend: 50           # for SPY/QQQ above MA
  ma_period_rising_falling: 20  # for HYG rising / TLT falling
  vix_threshold: 20
  size_multipliers:
    bullish: 1.25
    neutral: 1.0
    defensive: 0.5   # bearish / risk-off bucket (YAML may say "bearish" in prose; code uses defensive)
  # Practical SQQQ vs trend-long mapping by regime score (see src/regime_entry_policy.py).
  entry_policy:
    enabled: true
    severe_breakdown_min_pct_below_ma: 1.2   # QQQ must be this % below 50D MA
    severe_breakdown_require_fresh_cross: true
    # When scorer enabled but score missing (API gaps): conservative starter, severe required for SQQQ.
    block_sqqq_when_regime_score_unavailable: false
    require_severe_breakdown_when_regime_unavailable: true
    sqqq_fraction_when_regime_unavailable: 0.35
    long_fraction_when_regime_unavailable: 0.5
    sqqq_notional_fraction_score_4_5: 1.0
    long_notional_fraction_score_4_5: 1.0
    sqqq_notional_fraction_score_3: 0.5      # starter SQQQ
    long_notional_fraction_score_3: 0.75
    sqqq_notional_fraction_score_2: 0.35      # small SQQQ starter
    long_notional_fraction_score_2: 0.5       # longs smaller; MA stack required
    sqqq_notional_fraction_score_0_1: 0.25    # only with severe breakdown gate
    long_notional_fraction_score_1: 0.2       # mostly cash long book
    long_notional_fraction_score_0: 0.0
    score_1_block_all_longs: false            # true = no trend longs at score 1
    score_0_block_all_longs: true              # score 0: no trend longs by default
    # Score 2 SQQQ: keep notion×0.35; QQQ < 50D only; skip universe breakdown fresh-cross (see bear_etfs.breakdown).
    score_2_sqqq_skip_fresh_cross: true
    # Require **any** enabled sub-filter (OR). If all three false → no extra gate (only QQQ < 50D).
    score_2_sqqq_filter_below_vwap: false    # intraday session VWAP from 1m bars
    score_2_sqqq_filter_red_day: false        # last < today’s daily open (partial bar)
    score_2_sqqq_filter_ma20_below_ma50: true  # daily structure: 20D MA < 50D MA on QQQ

  # Intraday session **day type** (SPY 1m + optional VIX daily change). Stacks multipliers on top of
  # ``size_multipliers`` / entry_policy. >1 on ``entry_interval_mult`` = **longer** gaps between core/dynamic entry scans.
  day_types:
    # Set true to classify each session (SPY 1m) and apply ``profiles`` multipliers in the live loop.
    enabled: false
    panic_session_return_pct: -0.85
    panic_vix_change_ratio: 0.07
    chop_max_range_pct: 0.7
    chop_max_abs_return_pct: 0.12
    trend_min_abs_return_pct: 0.35
    trend_green_ratio_high: 0.57
    trend_green_ratio_low: 0.43
    drift_max_range_pct: 1.0
    drift_min_abs_return_pct: 0.08
    drift_green_ratio_min: 0.48
    drift_green_ratio_max: 0.56
    squeeze_narrow_lookback_bars: 30
    squeeze_max_rel_range_pct: 0.45
    squeeze_breakout_min_range_expand_pct: 0.2
    profiles:
      panic_selloff:
        position_size_mult: 0.55
        entry_interval_mult: 1.75
        exit_interval_mult: 0.65
        cooldown_mult: 1.45
        gross_exposure_mult: 0.72
      trend_day:
        position_size_mult: 1.08
        entry_interval_mult: 0.88
        exit_interval_mult: 1.05
        cooldown_mult: 0.92
        gross_exposure_mult: 1.05
      squeeze_day:
        position_size_mult: 1.02
        entry_interval_mult: 0.92
        exit_interval_mult: 0.88
        cooldown_mult: 1.0
        gross_exposure_mult: 1.02
      chop_day:
        position_size_mult: 0.68
        entry_interval_mult: 1.55
        exit_interval_mult: 1.15
        cooldown_mult: 1.35
        gross_exposure_mult: 0.82
      low_volatility_drift:
        position_size_mult: 0.92
        entry_interval_mult: 1.12
        exit_interval_mult: 1.08
        cooldown_mult: 1.08
        gross_exposure_mult: 0.95
      unknown:
        position_size_mult: 1.0
        entry_interval_mult: 1.0
        exit_interval_mult: 1.0
        cooldown_mult: 1.0
        gross_exposure_mult: 1.0

# ---------------------------------------------------------------------------
# 4c) Options (v1 — long premium; loop uses Alpaca chain + these caps)
# ---------------------------------------------------------------------------
# Long premium only: buy calls/puts; no short premium / no selling uncovered.
# Operator policy (enforced in code; see src/options_config.py, src/trend_long_ranked_dispatch.py):
#   (1) No new option buys when gross %% of equity > disable_if_gross_exposure_above (80%% below).
#   (2) No options when reduce_only / disable_if_reduce_only.
#   (3) Max contracts per trade = max_contracts_per_trade (1).
#   (4) Underlyings restricted to allowed_underlyings (SPY / QQQ / NVDA).
#   (5) Wide spreads rejected by max_bid_ask_spread_pct + selector + execution spread gate.
#   (6) never_bypass_stock_risk_caps: options pass strict bucket checks (no top-signal / cross-bucket
#       waiver); portfolio-full option bypass disabled — cannot sneak past stock risk caps.
# Canonical keys below; legacy aliases: allow_new_entries, fallback_to_stock, min_dte/max_dte (DTE window),
# max_options_notional_pct (aggregate cap), max_contracts_per_trade (alias of v1_max_contracts_per_trade),
# target_delta_min/max (alias of min_delta / cap on |delta|). See src/options_config.py.
# ``max_positions`` / ``max_option_positions`` / ``max_open_option_positions`` cap open option lines.
# ``min_delta`` / greeks: Alpaca ``OptionsSnapshot.greeks``; omit if your feed has no delta.
options:
  enabled: false
  # Dedicated live-options pilot flag. Live option orders require this to be true
  # and options.mode to be live/live_long_premium; false keeps live options blocked.
  live_pilot_enabled: false
  allow_new_entries: true
  new_entries_enabled: true
  # When true: strict risk-bucket test before any option order; disable bypass_when_full option retry.
  never_bypass_stock_risk_caps: true
  # Options routing: require ranked top-signal batch (aliases: top_signals_only, require_top_signal).
  require_top_signal: true
  allow_fallback_to_shares: true

  # Aggregate long-premium vs equity (alias: total_exposure_limit, max_options_notional_pct, max_total_options_exposure_pct).
  total_exposure_limit: 0.02
  # One new option order: fraction of equity (min() with max_option_position_pct and aggregate cap). Alias: max_premium_pct_of_equity.
  per_trade: 0.02
  # DTE window (aliases: min_dte / max_dte on this block).
  target_dte_min: 7
  target_dte_max: 21
  max_bid_ask_spread_pct: 12.0
  dynamic_entry:
    min_scanner_score: 50
    min_news_score: 8
    min_catalyst_score: 0.70
    paper_spread_relaxation:
      enabled: true
      max_bid_ask_spread_pct: 12.0
  # Phase 2: paper-trade options only (limit orders; no stock fallback when this mode is active).
  mode: paper_only
  # Per-order premium vs equity: use 2 for 2%%, or 0.02 for fraction of equity.
  max_option_position_pct: 0.02
  # Absolute premium debit cap per new option order; long-premium max loss cannot exceed this.
  max_premium_per_trade: 500
  max_option_positions: 1
  max_positions: 1
  data_stale_max_age_seconds: 120
  # Hard cap on contracts per order (alias: v1_max_contracts_per_trade).
  max_contracts_per_trade: 1
  premium_over_budget_try_lower_strike: true
  premium_over_budget_max_lower_strike_attempts: 200

  # Delta band on chain rows (requires greeks). min_delta alias: target_delta_min; max: target_delta_max.
  min_delta: 0.35
  target_delta_min: 0.35
  target_delta_max: 0.60

  # Risk gates (see src/options_config.options_entry_environment_blocks): block new option buys only.
  min_regime_score_for_entries: 2
  # Allow new option entries only while gross long MV %% of equity is below this (alias of disable_if_gross_exposure_above).
  enable_only_if_gross_below: 0.75
  disable_if_reduce_only: true
  disable_if_over_exposed: true

  # Daily cap on **option entry** orders (ET day; see src/options_entry_limits.py).
  max_option_trades_per_day: 1
  # Paper-options observability/safety framework. Paper-only by default; live promotion remains report-only.
  max_option_contracts_per_day: 1
  max_daily_options_loss_dollars: 250
  max_daily_options_loss_percent: 1.0
  cooldown_minutes_after_entry: 180
  cooldown_minutes_after_exit: 240

  only_buy_options: true
  allow_0dte: false
  allow_weeklies: true

  # Second-chance small call when equity book is full — off when never_bypass_stock_risk_caps is true.
  bypass_when_full:
    allow_when_full: false
    max_option_allocation_per_trade: 0.04
    min_signal_strength: 0.82

  allowed_underlyings:
    - SPY
    - QQQ
    - NVDA
    - AAPL
    - AMZN
    - SMH
    - TSLA
    - META
    - MSFT
    - GOOGL
    - AMD
    - AVGO
    - NFLX
    - PLTR
    - CRWD
    - DDOG
    - SNOW
    - ARM
    - MU
    - TSM
    - ADBE
    - RDDT
    - COIN
    - MSTR
    - HOOD
    - SOFI
    - UBER
    - SHOP
    - CRM
    - NOW
    - PANW
    - NET
    - MDB
    - MRVL
    - SMCI
    - ANET
    - INTC
    - QCOM
    - TXN
    - BA
    - JPM
    - GS
    - LLY
    - UNH
    - XOM
    - CVX
    - IWM
    - XBI
    - ORCL
    - BABA
    - INDA
    - GOOG
  allowed_symbols:
    - SPY
    - QQQ
    - NVDA
    - AAPL
    - AMZN
    - SMH
    - TSLA
    - META
    - MSFT
    - GOOGL
    - AMD
    - AVGO
    - NFLX
    - PLTR
    - CRWD
    - DDOG
    - SNOW
    - ARM
    - MU
    - TSM
    - ADBE
    - RDDT
    - COIN
    - MSTR
    - HOOD
    - SOFI
    - UBER
    - SHOP
    - CRM
    - NOW
    - PANW
    - NET
    - MDB
    - MRVL
    - SMCI
    - ANET
    - INTC
    - QCOM
    - TXN
    - BA
    - JPM
    - GS
    - LLY
    - UNH
    - XOM
    - CVX
    - IWM
    - XBI
    - ORCL
    - BABA
    - INDA
    - GOOG

  contract_selection:
    moneyness: ATM
    min_open_interest: 500
    min_volume: 100

  entry_mapping:
    bullish_signal: call
    bearish_signal: put

  trend_long_options_require_sqqq_and_strong_trend: false
  trend_strong_min_pct_above_50d_ma: 0.50
  min_regime_for_long: 2
  min_bullish_regime: 4

  exits:
    automation_enabled: true
    allow_overnight: false
    force_close_minutes_before_close: 15
    stop_loss_pct: 25
    stop_loss_exit_limit_per_day: 2
    profit_take_pct: 25
    profit_trail_arm_peak_pct: null
    profit_trail_exit_below_pct: null
    simple_price_exit_gain_pct: 50
    max_exit_spread_pct: 8.0
    max_hold_days: 0
    exit_if_underlying_breaks_signal: false
    exit_if_underlying_loses_vwap: true
    underlying_ma_period: 50
    exit_before_market_close_min: 5

  max_daily_loss_pct: 1.0

  compliance:
    block_if_pdt_risk: true
    use_cash_account_safe_mode: true

# ---------------------------------------------------------------------------
# 5) Execution
# ---------------------------------------------------------------------------
execution:
  # Mirrors ``risk`` / ``portfolio_risk`` per-symbol daily order cap (config_loader deep-merge).
  max_trades_per_symbol_per_day: 4
  strong_reentry_threshold: 0.65
  # Optional overlay for ``entries.symbol_cooldown_minutes`` (live-loop minutes-after-last-entry cooldown).
  # cooldown_minutes: 2
  # Maps to ``entries.allow_add_to_existing_positions`` + portfolio add-on paths (config_loader).
  allow_add_to_position: true
  # Second overlay; wins over ``cooldown_minutes`` when both set (config_loader merge order).
  add_position_cooldown_minutes: 45
  # Minimum USD clip for equity buys: ``execution.min_order_notional`` / ``min_trade_dollars`` + ``entries.min_trade_size``.
  min_trade_notional: 500
  add_on_signal_threshold: 0.55
  allow_fractional: true
  # Alias of ``allow_fractional``; when both are set, ``allow_fractional`` wins if present.
  allow_fractional_shares: true
  # Pre-entry cash probe for fractional longs (live loop / inverse); use with ``allow_fractional`` so we do not require 1 full share of BP before sizing.
  min_order_notional: 500
  # Minimum USD notional for equity **buy** market orders (explicit or qty×mid); ``0`` = off. OCC options exempt.
  min_trade_dollars: 500
  # Equity **sell** partials: bump qty to at least this fraction of the open position and/or USD notional
  # (``qty × mid``). Full exits (sell qty ≥ position) are unchanged. ``0`` = off. OCC options exempt.
  min_sell_pct_of_position: 0.2
  min_trade_value: 250
  prefer_limit_orders: true
  # If NBBO spread %% is **below** this, equity stock orders use **market**; at or above → **limit @ mid** (rounded).
  # Options (OCC) still use prefer_limit_orders / inside_spread below. Omit or null for legacy always-market equity.
  market_order_if_spread_below_pct: 0.2
  # inside_spread: limit = bid + inside_spread_fraction×(ask−bid) for buys (sell: ask − same).
  # mid_offset_ticks: legacy limit = mid ± tick_size × limit_order_offset_ticks.
  limit_price_mode: inside_spread
  inside_spread_fraction: 0.25
  limit_price_round_decimals: 2
  limit_order_offset_ticks: 1
  # Hard ceiling: do not submit when bid/ask spread %% exceeds this (applied as min with max_spread).
  skip_if_spread_above_pct: 3.5
  # One %% cap for all equity names (scalar). Restore a ``large_caps`` / ``volatile`` dict in overrides for tiers.
  # Bid/ask vs mid, same units as :attr:`~src.brokers.alpaca_client.QuoteInfo.spread_pct` (0.2 = 0.2%% of mid).
  # Slightly widened to reduce transient spread-gate misses without loosening the harder 2.5%% ceiling.
  max_spread_pct: 3.5
  # After a failed :meth:`build_order`, retry with spread gate ignored (transient wide NBBO).
  retry_on_spread_fail: true
  # Extra attempts after the first (each retry uses ``ignore_spread_gate``).
  retry_attempts: 2
  max_spread_pct_to_trade: 3.5   # legacy fallback when max_spread_pct absent only
  partial_fill_timeout_seconds: 30
  cancel_replace_on_partial: true
  max_slippage_bps: 10
  block_strategy_if_slippage_bps_avg_exceeds: 25
  # One engine wake (manage_positions + entry trim/replace in same loop tick): cap **sell** / cover
  # orders per symbol so e.g. risk trim + stop + signal_exit cannot all fire in the same pass. ``0`` = off.
  max_actions_per_symbol_per_cycle: 1
  # When true, skip discretionary long exits (engine partial/TP trail, broker P/L trim, news, smart scale)
  # if effective entry buying power is below ``entries.min_trade_size`` (see ``effective_buying_power_for_entries``).
  # Stop-like exits, kill-switch, and risk trims earlier in the pass (cap breach, overweight) are not gated.
  block_exits_if_no_reentry_capacity: true
  # If a new buy would break per-bucket MV / equity, still allow when ``strength_eff`` is in the
  # top ``top_signal_percentile`` of this entry wave's ``strength_cohort`` (see ranked scan; 2+ names). Single-name waves are never overridden.
  allow_bucket_override_for_top_signals: true
  top_signal_percentile: 0.2
  # When true, do not partial/full ``rebalance_free_capital`` sells to fund a new long if the
  # incoming name is a **strong** signal: in the top ``top_signal_percentile`` of *strength_cohort*
  # (2+ values), or else if ``incoming_strength`` ≥ ``rebalance_incoming_strength_block_min``
  # (default 0.85) when the cohort is missing or has one name.
  disable_rebalance_if_strong_signals: true
  rebalance_incoming_strength_block_min: 0.85
  # When this many entry candidates in one scan have ``strength_eff`` ≥ ``strong_signal_strength_min``,
  # min cash reserve is set to 0 for deployable buying power (fully invested subject to broker BP).
  strong_signals_count: 5
  # Trend-long routing / entry-wave “strong” count (also allocator vs equity batch); lower = more names qualify.
  strong_signal_strength_min: 0.72
  # Skip **discretionary** equity sells in the exit pass and RFC/cash trim sells when the position's
  # last buy/scale (tracker) was within this many minutes. Stop-like, kill-switch, and symbol-cap
  # rebalance still sell. ``0`` = off.
  no_sell_within_min_of_buy: 30
  # Re-entry: wait after a **recorded** stop/profit exit in engine state (same source as
  # ``last_stop_loss_at`` / ``last_profit_exit_at``). Stricter of this and
  # ``entries.per_symbol_sell_cooldown_min`` is applied. Defaults: 30m stocks; 60m for
  # ``symbol_cooldown_etf_symbols`` in code if ``symbol_cooldown_etf_minutes`` is omitted.
  symbol_cooldown_minutes: 20
  symbol_cooldown_etf_minutes: 20   # shortened (was 60) same-symbol re-entry wait for ETF tier
  symbol_cooldown_etf_symbols: [SPY, XLP]
  # Post-exit re-entry: uses this shorter window (vs default ETF/stock tiers) — list your top-momentum names.
  symbol_cooldown_top_momentum_symbols: [RGTI, QBTS, IONQ]
  symbol_cooldown_top_momentum_minutes: 25
  min_recent_exit_reentry_minutes: 60
  low_regime_top_n_regime_score_max: 3
  low_regime_top_n_stock_entries: 5

# ---------------------------------------------------------------------------
# 7) Broker (Alpaca)
# ---------------------------------------------------------------------------
broker:
  provider: alpaca
  firm: alpaca
  # paper: true  = paper trading (no real money).  paper: false  = LIVE (real money).
  # Override without editing file: APCA_PAPER=false or ALPACA_LIVE=true for live; APCA_PAPER=true for paper.
  paper: false
  # Run continuously until market close (no user interaction):
  #   python run_alpaca_loop.py
  run_until_close: false
  exit_check_interval_minutes: 12   # legacy; prefer timing.exit_interval_min (stop/target/trail/time cadence)
  entry_check_interval_minutes: 10  # legacy; prefer timing.entry_interval_min
  # Retry on API connection drops (e.g. "Remote end closed connection")
  # api_retry_times: 3
  # api_retry_delay_sec: 3.0
  # data_feed: iex   # free. Use "sip" only if you have a paid data subscription.
  # options_feed: indicative   # Alpaca option chain: "indicative" (default) or "opra" (paid subscription)
  trade_update_stream:
    # Optional order/trade update stream. Disabled by default; REST polling remains fallback/source of truth.
    enabled: false
  # API keys from environment (never put real keys in this file):
  #   Paper: APCA_API_KEY_ID, APCA_API_SECRET_KEY  (from Alpaca Paper Trading → API Keys)
  #   Live:  ALPACA_LIVE_API_KEY_ID, ALPACA_LIVE_API_SECRET_KEY  (from Alpaca Live → API Keys; Alpaca uses separate keys for live)
  #   Or set APCA_* to live keys when running --live (then use paper keys only when running --paper).
  # Paper base URL: https://paper-api.alpaca.markets   Live: https://api.alpaca.markets


# ---------------------------------------------------------------------------
# 8) Guarded live AutoOps deployment
# ---------------------------------------------------------------------------
autoops:
  # Only ./bin/algo autoops deploy-latest --live uses these gates.
  # The log analyzer remains read-only and never restarts services.
  live_auto_deploy_enabled: true
  live_auto_restart_enabled: true
  live_post_deploy_verify_enabled: true
  live_end_day_analysis_enabled: true
  live_end_day_issue_enabled: true
  live_end_day_codex_enabled: true
  live_end_day_codex_autostart_enabled: true
  codex_precheck_enabled: true
  codex_max_issue_tokens: 50000
  codex_max_issue_runtime_minutes: 45
  codex_large_issue_requires_decomposition: true

# ---------------------------------------------------------------------------
# 9) Read-only automated log analysis
# ---------------------------------------------------------------------------
analysis:
  # Live GitHub issue creation is enabled for the read-only log analyzer.
  # Timer-safe thresholds still apply; market-data noise is suppressed in timer mode.
  # The analyzer never restarts services or changes trading behavior.
  enabled: true
  github_issue_enabled: true
  interval_minutes: 5
  lookback_minutes: 30
  duplicate_window_hours: 24
  processor_label_enabled: false
  processor_labels:
    paper: "processor:mac-paper"
    live: "processor:live"
  # Post-fix comments and auto-close apply only to matching analyzer-created issues.
  # Service restarts and auto-merge are not performed by this read-only analyzer.
  github_comment_enabled: true
  auto_close_resolved_issues: true
  issue_thresholds:
    skip_reason: 5
    traceback: 1
    exception: 1
    service_restart: 2
    entry_eval_to_skip: 10
    allocator_dispatch_skip: 3
    unstable_quote: 150
    spread_too_wide: 15
    expected_strategy_skip: 50
    pipeline_skip_after_entry: 1
  paper_issue_thresholds:
    skip_reason: 5
    traceback: 1
    exception: 1
    service_restart: 2
    entry_eval_to_skip: 3
    allocator_dispatch_skip: 3
    unstable_quote: 5
    spread_too_wide: 5
    expected_strategy_skip: 50
    pipeline_skip_after_entry: 1

# ---------------------------------------------------------------------------
# 6) Compliance (PDT, etc.)
# ---------------------------------------------------------------------------
compliance:
  # Alpaca may still reject orders (e.g. API 40310100 pattern day trader) on restricted accounts; the app cannot override the broker.
  pdt_min_equity: 25000
  pdt_enabled: true
  margin_account: true
  # Below $25k on a margin account: never submit same-day closes (stocks, options, short covers) — avoids PDT / 40310100 churn.
  avoid_same_day_close_below_pdt_equity: true
  day_trade_count_reset_calendar: "rolling_5_business_days"
  best_execution_note: "Broker has best execution duty; app enforces limits only."
